<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Inloggen — Propagandamodel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/huisstijl.css">
<style>
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.kaart { width: 340px; padding: 28px; box-shadow: var(--shadow); margin: 0; }
h1 { font-size: 17px; margin: 0 0 2px; }
.sub { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; }
label { display: block; font-size: 11px; color: var(--text-dim); margin: 12px 0 4px;
        text-transform: uppercase; letter-spacing: 0.05em; }
input { width: 100%; padding: 9px 10px; border-radius: 7px; border: 1px solid var(--border);
        background: var(--bg-inzet); color: var(--text); font-size: 14px; }
input:focus { outline: none; border-color: var(--accent); }
button { width: 100%; margin-top: 18px; padding: 10px; font-size: 14px; }
.fout { margin-top: 12px; }
.voet { margin-top: 18px; font-size: 11px; color: var(--text-muted); }
.voet a { color: var(--text-dim); }
</style>
</head>
<body>
<form class="kaart" id="loginForm">
  <h1>Propagandamodel</h1>
  <div class="sub">Inloggen voor bijdragen — lezen kan zonder account.</div>
  <label for="username">Gebruikersnaam</label>
  <input id="username" autocomplete="username" autofocus>
  <label for="password">Wachtwoord</label>
  <input id="password" type="password" autocomplete="current-password">
  <button type="submit" class="prim">Inloggen</button>
  <div class="fout fout-tekst" id="fout"></div>
  <div class="voet">
    Nog geen account of wachtwoord? Maak het aan met
    <code>scripts/create_user.py</code>. Agents en Claude Code gebruiken een
    Bearer-token (zie <a href="/account">accountpagina</a>).
  </div>
</form>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fout = document.getElementById('fout');
  fout.textContent = '';
  try {
    const resp = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });
    const data = await resp.json();
    if (!resp.ok) { fout.textContent = data.error || 'Inloggen mislukt'; return; }
    window.location.href = '/';
  } catch (err) { fout.textContent = 'Netwerkfout: ' + err.message; }
});
</script>
</body>
</html>
