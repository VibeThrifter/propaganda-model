<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Overleg — Propagandamodel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/huisstijl.css">
<script src="/static/huisstijl.js"></script>
<style>
html, body { height: 100%; }
body { display: flex; flex-direction: column; }
/* De topbal scrollt hier niet mee (eigen paneel-layout met interne scroll). */
header.topbal { position: static; }
#tab-overleg { flex: 1; display: flex; min-height: 0; }
#tab-overleg.verborgen, #tab-voorstellen.verborgen, #tab-bronnen.verborgen { display: none; }
/* — Overleg (threads) — */
#oIndex { width: 340px; flex-shrink: 0; border-right: 1px solid var(--border);
          display: flex; flex-direction: column; min-height: 0; }
/* Eén filterzone (W3.4): twee rijen, daaronder meteen de lijst. */
#oBalk { display: flex; flex-direction: column; gap: 7px; padding: 10px 10px 9px;
         border-bottom: 1px solid var(--border); }
.obalk-rij { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#oZoek { flex: 1; min-width: 120px; margin: 0; padding: 6px 10px; border-radius: 8px;
         border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
         font: inherit; font-size: 12px; }
#oBalk select { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 5px 6px;
         border-radius: 7px; border: 1px solid var(--border); background: var(--bg-card);
         color: var(--text-dim); }
#oBalk select:hover { color: var(--text); border-color: var(--border-light); }
#oFilterDot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
         border: 1px solid var(--border); }
#oLijst { overflow-y: auto; padding: 0 6px 14px; flex: 1; }
.lijst-legenda { display: flex; align-items: center; gap: 5px; font-size: 10.5px;
         color: var(--text-muted); padding: 8px 8px 2px; }
.groep-kop { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted);
             padding: 10px 8px 4px; position: sticky; top: 0; background: var(--bg); }
.t-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
          font-size: 12px; color: var(--text-dim); cursor: pointer; }
.t-item:hover { background: rgba(255,255,255,.06); color: var(--text); }
.t-item.actief { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--text); }
.t-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-n { font-size: 10px; padding: 0 6px; border-radius: 8px; flex-shrink: 0; font-variant-numeric: tabular-nums;
       background: rgba(255,255,255,.08); color: var(--text-muted); }
.t-n.open { background: color-mix(in srgb, var(--goud) 22%, transparent); color: var(--goud); }
.filter-kop { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-dim);
              padding: 7px 8px 7px 8px; border-radius: 6px; cursor: pointer; user-select: none; }
.filter-kop:hover { background: rgba(255,255,255,.05); color: var(--text); }
.filter-kop .chev { font-size: 9px; color: var(--text-muted); transition: transform .15s; display: inline-block; width: 9px; }
.filter-kop.open .chev { transform: rotate(90deg); }
.filter-kop .fdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.filter-kop .fn { margin-left: auto; font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.filter-groep { padding-bottom: 3px; }
.filter-groep .t-item { margin-left: 14px; }
/* Filterchips: "filteren op de filter" */
.filter-chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px 10px; }
.fchip { font-size: 11px; padding: 3px 9px; border-radius: 11px; cursor: pointer; white-space: nowrap;
         border: 1px solid var(--border); color: var(--text-dim); display: inline-flex; align-items: center; gap: 5px; }
.fchip:hover { color: var(--text); }
.fchip .fdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.fchip .fc-n { font-size: 9.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.fchip.actief { color: var(--text); background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.28); }
.fchip.open-chip { margin-left: auto; color: var(--goud); border-color: color-mix(in srgb, var(--goud) 35%, transparent); }
.fchip.open-chip.actief { background: color-mix(in srgb, var(--goud) 18%, transparent); color: var(--goud); }
.filter-chips.toolbar { padding-top: 2px; border-bottom: 1px solid var(--border); margin-bottom: 8px; padding-bottom: 10px; }
#oPaneel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#oDetail { flex: 1; overflow-y: auto; padding: 20px 26px; min-width: 0; }
/* W4.3: onder ~800px zijn lijst en gesprek twee schermen; de klasse .m-detail op
   #tab-overleg kiest welk scherm zichtbaar is (desktop negeert haar — de media query
   beperkt de werking). De terugbalk bestaat alleen op het gesprek-scherm. */
#oTerugBalk { display: none; flex-shrink: 0; padding: 7px 8px; border-bottom: 1px solid var(--border); }
#oTerugBalk button { background: none; border: none; color: var(--accent); font: inherit;
  font-size: 13px; cursor: pointer; padding: 5px 9px; border-radius: 6px; }
#oTerugBalk button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
@media (max-width: 800px) {
  #oIndex { width: auto; flex: 1 1 auto; border-right: none; }
  #tab-overleg.m-detail #oIndex,
  #tab-overleg:not(.m-detail) #oPaneel { display: none; }
  #oTerugBalk { display: flex; }
  #oDetail { padding: 14px 14px 22px; }
}
/* argumentboom */
.arg { position: relative; border-left: 2px solid var(--border); padding: 6px 0 6px 14px; margin: 6px 0; }
/* tak-connector: verbindt de verticale ruggengraat van de ouder met elke reactie eronder,
   zodat de boomstructuur leesbaar wordt (een reageer-knop bouwt zichtbaar een tak). */
.arg .arg::before { content: ''; position: absolute; left: -16px; top: 15px; width: 14px; height: 2px;
  background: var(--border); }
/* Rustige knoop (W3.2): kop = inhoud + één ⋯-knop rechts; acties zitten in het menu.
   De flex-layout geldt alleen mét tekst-wrapper (de read-only renderers houden de
   gewone inline kop). */
.arg-kop { font-size: 13.5px; }
.arg-kop:has(> .arg-kop-tekst) { display: flex; align-items: flex-start; gap: 8px; }
.arg-kop-tekst { flex: 1; min-width: 0; }
/* ⋯-knopstijl (.hs-menu-knop) komt uit de huisstijl — gedeeld met de viz-boom (W3.2b). */
.stance { font-weight: 700; }
.arg-reden { font-size: 12.5px; color: var(--text-dim); margin: 3px 0; white-space: pre-wrap; }
.arg-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.cite { font-size: 12px; color: var(--text-dim); margin: 4px 0 4px 6px; border-left: 2px solid var(--goud);
        padding-left: 8px; }
.cite-src { color: var(--text-muted); }
.cite-src a { color: var(--accent); text-decoration: none; }
.cite-src a:hover { text-decoration: underline; }
.cite-src a.arch { color: var(--text-muted); font-size: 11px; }
.cite .stub { color: #e0a23a; font-size: 11px; margin-left: 4px; }
.cites { margin: 6px 0 10px; }
.bronbadge { font-size: 12px; color: #e0a23a; background: rgba(224,162,58,.10);
             border: 1px solid color-mix(in srgb, #e0a23a 35%, transparent); border-radius: 8px;
             padding: 6px 10px; margin: 2px 0 10px; }
.bronbadge code { background: rgba(0,0,0,.3); padding: 1px 4px; border-radius: 4px; }
/* oordeel-paar: ✓ Argument klopt / ✗ Argument klopt niet — gebalanceerd, samen, even zwaar */
.oordeel-rij { display: flex; align-items: center; gap: 8px; margin: 6px 0 2px; font-size: 11px; flex-wrap: wrap; }
.oordeel { padding: 2px 10px; border-radius: 9px; border: 1px solid var(--border); font-variant-numeric: tabular-nums; }
.oordeel-saldo { margin-left: auto; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.oordeel.knop { cursor: pointer; }
.oordeel.eens { color: #3ddc84; border-color: color-mix(in srgb, #3ddc84 32%, transparent); }
.oordeel.eens.knop:hover, .oordeel.eens.aan { background: color-mix(in srgb, #3ddc84 14%, transparent); }
.oordeel.oneens { color: #e0635f; border-color: color-mix(in srgb, #e0635f 32%, transparent); }
.oordeel.oneens.knop:hover { background: color-mix(in srgb, #e0635f 14%, transparent); }
.oordeel.stat { opacity: .7; }
/* neutrale actieknop (o.a. '+ bron toevoegen' in het citatie-formulier) */
.reageer-knop { font-size: 11px; cursor: pointer; padding: 2px 10px; border-radius: 9px;
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); user-select: none; }
.reageer-knop:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.reply-kruimel { font-size: 11px; color: var(--text-muted); margin: 2px 0 8px; line-height: 1.4; }
.reply-kruimel b { color: var(--text-dim); font-weight: 600; }
/* statusbadge (basis in huisstijl.css): poort & revisie zichtbaar in de thread */
.statusbadge { margin-left: 6px; }
.arg.vervangen-arg { opacity: .55; }
.arg.dit-voorstel { background: color-mix(in srgb, var(--accent) 10%, transparent); border-left-color: var(--accent); }
.reviewthread { border: 1px solid var(--border); border-radius: 8px; padding: 4px 12px; margin: 8px 0 4px;
  background: rgba(0,0,0,.18); }
.reviewthread .kop { font-size: 11px; color: var(--text-muted); margin: 4px 0; }
.revisie-noot { font-size: 12px; color: var(--accent); margin: 2px 0 6px; }
/* ratings (community-notes-laag, M2.5): mens telt, agent = advies */
.ratings { display: flex; gap: 8px; align-items: center; margin: 5px 0 2px; font-size: 11.5px; }
.rate-tel, .rate-knop { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.rate-knop { cursor: pointer; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--border); }
.rate-knop:hover { color: var(--text); border-color: rgba(255,255,255,.28); }
.rate-knop.aan { color: var(--text); background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.32); }
.eigen-werk { color: var(--text-muted); font-style: italic; }
.bridging-hint { font-size: 11px; color: var(--text-muted); background: rgba(255,255,255,.03);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin: 0 0 14px; line-height: 1.5; }
.bridging-hint.verouderd { border-color: color-mix(in srgb, #e0a23a 30%, transparent); }
/* permalinks + round-trip naar de graaf */
.permalink { font-size: 11px; color: var(--text-muted); text-decoration: none; margin-left: 6px; }
.permalink:hover { color: var(--accent); }
.graaf-link { display: inline-block; font-size: 12px; color: var(--accent); text-decoration: none; margin-bottom: 14px; }
.graaf-link:hover { text-decoration: underline; }
.context-link { font-size: 11px; color: var(--accent); text-decoration: none; margin-left: 8px; }
.context-link:hover { text-decoration: underline; }
/* startkaart (W3.1): het rechtervlak verwelkomt i.p.v. leeg te staren */
.start-kaart { max-width: 700px; }
.start-kaart h2 { font-size: 16px; margin: 0 0 6px; }
.start-intro { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; max-width: 62ch; }
.start-sectie { margin: 0 0 22px; }
.start-sectie .vlabel { display: flex; align-items: center; gap: 4px; font-size: 11px;
  text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 7px; }
.start-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.start-chips .fchip { font-size: 12px; padding: 5px 12px; }
.wacht-n { font-size: 10.5px; padding: 0 6px; border-radius: 8px; font-variant-numeric: tabular-nums;
  background: rgba(255,255,255,.08); color: var(--text-muted); }
.wacht-n.open { background: color-mix(in srgb, var(--goud) 22%, transparent); color: var(--goud); }
.start-item { display: block; padding: 7px 9px; border-radius: 6px; cursor: pointer; }
.start-item:hover { background: rgba(255,255,255,.06); }
.start-item .si-claim { font-size: 12.5px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.start-item:hover .si-claim { color: var(--text); }
.start-item .si-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* doel-badge: over wélk element gaat dit argument — prominent boven de bewering */
.doel-badge { display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 6px;
  font-size: 12px; margin: 2px 0 8px; padding: 4px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--accent) 12%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent); }
.doel-badge .doel-type { font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--accent); font-weight: 600; }
.doel-badge b { color: var(--text); font-weight: 600; }
.doel-badge .doel-reply { color: var(--text-muted); font-style: italic; }
.doel-badge .doel-graaf { font-size: 11px; color: var(--accent); text-decoration: none; }
.doel-badge .doel-graaf:hover { text-decoration: underline; }
/* formulier (basis in huisstijl.css) */
.form { margin-top: 16px; }
.stance-kies { display: flex; gap: 6px; }
.stance-kies button { flex: 1; }
.stance-kies button.sel-sup { background: var(--knop-groen); border-color: transparent; color: #fff; }
.stance-kies button.sel-con { background: var(--knop-rood); border-color: transparent; color: #fff; }
.stance-kies button.sel-ctx { background: var(--knop-context); border-color: transparent; color: #fff; }
.stance-kies.vast { display: block; }
.stance-vast { display: inline-block; background: var(--knop-rood); color: #fff; font-size: 12px;
  font-weight: 600; padding: 4px 12px; border-radius: 6px; }
.rij2 { display: flex; gap: 10px; }
.rij2 > div { flex: 1; }
.bronkies { position: relative; }
.bron-resultaten { position: absolute; z-index: 30; left: 0; right: 0; margin-top: 2px;
        background: var(--bg-card); border: 1px solid var(--border); border-radius: 7px;
        max-height: 220px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.bron-optie { padding: 7px 9px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--border); }
.bron-optie:last-child { border-bottom: none; }
.bron-optie:hover { background: rgba(255,255,255,.07); }
.bron-optie.nieuw { color: var(--goud); font-weight: 600; }
.bron-leeg { padding: 7px 9px; font-size: 12px; color: var(--text-muted); }
.melding { margin-top: 8px; }
/* — Voorstellen (review) — */
#tab-voorstellen, #tab-bronnen { flex: 1; overflow-y: auto; }
.vsegment { display: inline-flex; gap: 4px; padding: 4px; margin: 0 0 16px; border-radius: 11px;
  background: rgba(0,0,0,.25); border: 1px solid var(--border); }
.vpil { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim);
  padding: 6px 14px; border-radius: 8px; cursor: pointer; user-select: none; }
.vpil:hover { color: var(--text); }
.vpil.actief { background: color-mix(in srgb, var(--accent) 17%, transparent); color: var(--text);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.vpil-n { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: rgba(255,255,255,.08);
  color: var(--text-muted); font-variant-numeric: tabular-nums; }
.vpil.actief .vpil-n { color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
/* Sub-tabs binnen een segment (Praktijk → entiteiten/relaties; Argumenten → per type):
   lichter dan de hoofd-segmentpillen, zitten er direct onder. */
.vsubsegment { display: inline-flex; flex-wrap: wrap; gap: 5px; margin: -8px 0 16px; }
.vsubpil { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim);
  padding: 4px 11px; border-radius: 8px; cursor: pointer; user-select: none; border: 1px solid var(--border); }
.vsubpil:hover { color: var(--text); background: var(--bg-hover); }
.vsubpil.actief { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--text);
  border-color: color-mix(in srgb, var(--accent) 34%, transparent); }
main { max-width: 880px; margin: 0 auto; padding: 22px; }
.kaart { padding: 18px 20px; }
/* Wachtrij-item + agent-advies ernaast (reviewbeoordelaar; los van het model, telt niet mee) */
.kaart-rij { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; }
.kaart-rij > .kaart { flex: 1 1 460px; min-width: 0; margin-bottom: 0; }
.advies { flex: 0 1 300px; min-width: 230px; align-self: stretch; background: color-mix(in srgb, var(--bg-card) 80%, transparent);
          border: 1px solid var(--border); border-left-width: 3px; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; }
.advies-kop { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.advies-titel { font-weight: 600; color: var(--text); margin-bottom: 4px; }
.advies-detail { color: var(--text-dim); line-height: 1.5; white-space: pre-wrap; }
.advies-broncheck { margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--border);
                    font-size: 11.5px; color: var(--text-dim); }
.advies-bron { margin-top: 9px; font-size: 10px; color: var(--text-muted); }
/* Rechterkolom kan meerdere adviespanelen stapelen (reviewbeoordelaar + bron-suggesties). */
.rechtkolom { flex: 0 1 320px; min-width: 230px; align-self: stretch; display: flex; flex-direction: column; gap: 10px; }
.rechtkolom > .advies, .rechtkolom > .bronsug { flex: 0 0 auto; min-width: 0; align-self: stretch; }
.bronsug { background: color-mix(in srgb, var(--bg-card) 80%, transparent); border: 1px solid var(--border);
           border-left: 3px solid #5bc8c2; border-radius: 10px; padding: 12px 14px; font-size: 12.5px; }
.bronsug-kop { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #5bc8c2; margin-bottom: 6px; }
.bronsug-reden { color: var(--text-muted); font-size: 11.5px; margin-bottom: 8px; }
.bronsug-item { padding: 7px 0; border-top: 1px dashed var(--border); }
.bronsug-item:first-of-type { border-top: none; padding-top: 0; }
.bronsug-titel { font-weight: 600; color: var(--text); }
.bronsug-waarom { color: var(--text-dim); line-height: 1.45; margin-top: 2px; }
.bronsug-quote { color: var(--text-dim); font-style: italic; margin-top: 3px; }
.bronsug-check { margin-top: 4px; font-size: 11.5px; }
.bronsug-add { margin-top: 6px; font-size: 11px; cursor: pointer; padding: 2px 9px; border-radius: 8px;
  border: 1px solid color-mix(in srgb, #5bc8c2 45%, transparent); color: #5bc8c2; background: transparent; }
.bronsug-add:hover { background: color-mix(in srgb, #5bc8c2 14%, transparent); }
.bronsug-add.toegevoegd { color: var(--text-muted); border-color: var(--border); cursor: default; }
.bronsug-add:disabled { opacity: .6; cursor: default; }
.bronsug-bron { margin-top: 9px; font-size: 10px; color: var(--text-muted); }
.soort { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--goud); }
.kaart h3 { font-size: 15px; margin: 4px 0 6px; }
.meta { margin-bottom: 10px; }
.veld { margin: 10px 0; }
.veld .vlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 2px; }
.veld .vwaarde { font-size: 13px; white-space: pre-wrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.tag { font-size: 11px; padding: 2px 9px; border-radius: 9px; background: rgba(255,255,255,.06); color: var(--text-dim); }
ul.lijst { margin: 4px 0 0; padding-left: 18px; font-size: 13px; }
.acties { margin-top: 14px; }
</style>
</head>
<body>
<header class="topbal" data-actief="overleg">
  <div class="topbal-slot">
    <div class="tabs">
      <div class="tab actief" id="tabOverleg" onclick="kiesTab('overleg')">Threads</div>
      <div class="tab" id="tabVoorstellen" onclick="kiesTab('voorstellen')">Voorstellen<span class="badge" id="vBadge" style="display:none">0</span></div>
      <div class="tab" id="tabBronnen" onclick="kiesTab('bronnen')">Bronnen</div>
    </div>
    <button class="icoon" onclick="ververs()" title="Alles opnieuw laden" aria-label="Alles opnieuw laden">↻</button>
  </div>
</header>

<div id="tab-overleg">
  <div id="oIndex">
    <!-- Eén compacte zoek-en-filterzone (W3.4): rij 1 = zoeken + alleen-open,
         rij 2 = soort- en filterkeuze. Zelfde state/gedrag als de oude chip-lagen. -->
    <div id="oBalk">
      <div class="obalk-rij">
        <input type="text" id="oZoek" placeholder="Zoek in threads…" autocomplete="off" spellcheck="false">
        <span class="fchip open-chip" id="oOpenChip" onclick="toggleAlleenOpen()"
              title="Alleen threads met open (voorgestelde) argumenten">● open</span>
      </div>
      <div class="obalk-rij">
        <select id="oSoortSel" onchange="kiesSoort(this.value)" aria-label="Soort element"></select>
        <span class="fdot" id="oFilterDot"></span>
        <select id="oFilterSel" onchange="kiesFilter(this.value)" aria-label="Propagandafilter"></select>
      </div>
    </div>

<script src="/static/shared_vocab.js"></script>
<script>
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// Escapet tekst veilig én maakt kale http(s)-URL's erin klikbaar (voor vrije-tekst bronnen).
function linkify(s) {
  s = String(s ?? '');
  const re = /https?:\/\/[^\s<>"')\]]+/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    out += `<a href="${esc(m[0])}" target="_blank" rel="noopener">${esc(m[0])}</a>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
let ME = null;
// Voorstellen/review-wachtrij is reviewer-werkruimte: alleen ingelogde reviewer+ ziet 'm
// (spiegelt de server-poort op /api/review_queue en /api/voorstellen). Bijdragers zien
// hun eigen ingediende werk in de werkbank, niet hier.
function magReview() { return !!(ME && ME.role && ME.role !== 'bijdrager'); }
let ROLLEN = [];          // lichte rollenlijst (GET /api/roles) voor de rol-keuze bij entiteit-goedkeuring
// Structurele entiteittypes (de niet-legacy set uit schema.sql) voor de bewerk-dropdown bij
// heraanmelden; legacy-types blijven geldig maar tonen we niet als nieuwe keuze. De huidige
// waarde wordt sowieso toegevoegd als ze hier ontbreekt (zie selectOpties).
const ENTITEIT_TYPES = ['persoon', 'partij', 'mediaorganisatie', 'persbureau', 'bedrijf',
  'lobbygroep', 'denktank', 'overheidsinstelling', 'toezichthouder', 'ngo', 'vakbond',
  'omroep', 'elite_netwerk', 'vermogensbeheerder', 'pr_bureau', 'platform',
  'rechterlijke_macht', 'onderwijsinstelling', 'burgerinitiatief', 'stichting'];
const RELATIE_TYPES = ['eigendom', 'financiering', 'adverteerder', 'donor', 'investering',
  'lidmaatschap', 'personeel', 'bestuurder', 'adviseur', 'woordvoerder_van', 'draaideur',
  'bron_van', 'mediaplatform', 'framing', 'citeert', 'lobbyt', 'censuur', 'flak',
  'intimidatie', 'regulering', 'zelfcensuur', 'alliantie', 'oppositie', 'beinvloeding',
  'cooptatie', 'etikettering', 'algoritmische_filtering'];
// Bouwt <option>s met `huidig` voorgeselecteerd; voegt een onbekende huidige waarde
// (bv. een legacy-type) vooraan toe zodat het bewerkformulier haar nooit stilletjes wist.
function selectOpties(lijst, huidig) {
  const waarden = lijst.includes(huidig) || !huidig ? lijst.slice() : [huidig, ...lijst];
  return waarden.map(v => `<option value="${esc(v)}"${v === huidig ? ' selected' : ''}>${esc(v)}</option>`).join('');
}
let BRIDGING = null;      // bridging-status (M2.5): wanneer telt een rating mee in de score?
let indexData = null;
let huidig = null;        // {param, id, label}
let ARG_BY_ID = new Map();// argumenten van de geopende thread (voor bewerk/reviseer-formulieren)
// ── Bewerkbare-thread contexten ──────────────────────────────────────────────
// Eén bewerkbare boom-renderer (rendNode + zijn acties) wordt op twee plekken gebruikt:
// het Threads-tabblad (context '') en de bewerkbare discussieboom onder een afgewezen
// element (context 'afg-<soort>-<id>'). Beide tabbladen staan tegelijk in de DOM, dus de
// reply-/bewerk-slots krijgen per context een eigen prefix — anders zou getElementID het
// gelijknamige slot van het Threads-tabblad pakken. Elke context levert ook zijn eigen
// argumentenkaart (voor de voorgevulde bewerk-formulieren) en eigen herlaad-functie.
const THREADCTX = {
  '': { map: () => ARG_BY_ID,
        herlaad: () => { if (huidig) toonThread(huidig.param, huidig.id, huidig.label); } },
};
const ctx = ck => THREADCTX[ck || ''] || THREADCTX[''];
const replySlot = (ck, id) => (ck ? ck + '__' : '') + 'reply-' + id;
const ctxHerlaad = ck => ctx(ck).herlaad();
let reviewGeladen = false;
let reviewData = null;          // gecachete /api/review_queue zodat de segmented control niet herfetcht
let adviesData = null;          // gecachet /api/review_advies — agent-advies naast elk item (reviewer+, los van het model)
let afgewezenData = null;       // gecachet /api/afgewezen — afgewezen/ingetrokken inzendingen (reviewer+)
let bronSuggestiesData = null;  // gecachet /api/bron_suggesties — door documentalist voorgestelde bronnen + check (reviewer+)
let actiefVoorstelType = 'rfc'; // 'rfc' | 'argumenten' — welke lijst op het Voorstellen-tabblad
let voorstelTypeGekozen = false;// heeft de gebruiker zelf gekozen? (anders auto-default op niet-leeg)
// Toolbar-state: soort (groep), filter (de model-as), alleen-open, en welke
// accordions openstaan. Standaard alles ingeklapt → overzicht eerst.
let actiefSoort = null;   // null = alle | 'relaties' | 'mechanismen' | 'rollen' | 'emergente_velden'
let actiefFilter = null;  // null = alle | filterkey
let alleenOpen = false;   // alleen threads met open (voorgestelde) argumenten
const openGroepen = new Set();  // uitgeklapte accordions, key = "groep:filter"

// Vierde veld = subgroepeer per filter (de ruggengraat van het model: 1→5 + tegenmacht).
const GROEPEN = [
  ['relaties', 'Relaties', 'relation_id', true],
  ['entiteiten', 'Entiteiten', 'entity_id', false],
  ['rollen', 'Rollen', 'role_id', false],
  ['mechanismen', 'Mechanismen', 'mechanism_id', true],
  ['emergente_velden', 'Emergente velden', 'emergent_effect_id', false],
];
// FILTER_COLORS/FILTER_LABELS komen uit de gedeelde model-woordenschat
// (/static/shared_vocab.js — zelfde bron als de netwerkviz). Hier alleen de overleg-eigen
// uitbreiding '' = relatie zonder mechanisme.
const FILTER_KLEUR = { ...FILTER_COLORS, '': '#5a5a70' };
const FILTER_LABEL = { ...FILTER_LABELS, '': 'Zonder mechanisme' };
const FILTER_VOLGORDE = ['eigendom', 'advertentie', 'sourcing', 'flak', 'ideologie',
  'tegenmacht', 'cross_filter', 'systeemactor', 'overig', ''];
const STANCE = { supporting: ['+', '#3ddc84'], contradicting: ['−', '#e0635f'], contextual: ['~', '#8888a0'] };

function toonTabUI(naam) {
  document.getElementById('tab-overleg').classList.toggle('verborgen', naam !== 'overleg');
  document.getElementById('tab-voorstellen').classList.toggle('verborgen', naam !== 'voorstellen');
  document.getElementById('tab-bronnen').classList.toggle('verborgen', naam !== 'bronnen');
  document.getElementById('tabOverleg').classList.toggle('actief', naam === 'overleg');
  document.getElementById('tabVoorstellen').classList.toggle('actief', naam === 'voorstellen');
  document.getElementById('tabBronnen').classList.toggle('actief', naam === 'bronnen');
}
function kiesTab(naam) {
  if (naam === 'voorstellen' && !magReview()) return;  // reviewer-only werkruimte
  toonTabUI(naam);
  if (naam === 'voorstellen' && !reviewGeladen) laadVoorstellen();
  if (naam === 'bronnen' && !bronnenGeladen) laadBronnen();
}

// ── Bronnen-classificatie (reviewer-werk): reliability (rigueur) + onderwerp (relevantie
// voor het NL-mediasysteem) sturen de bronfactor in scoring.py. De poort (server) weigert
// een klasse die niet bij het brontype past of (hoge klasse) zonder vindplaats. ──
const RELIABILITY_OPTS = ['primair', 'academisch', 'institutioneel', 'kwaliteitsjournalistiek',
  'regulier', 'opinie', 'grijs', 'eigen_synthese', 'onbeoordeeld'];
const ONDERWERP_OPTS = ['nl_systeem', 'algemeen', 'buitenlands', 'onbepaald'];
const ONDERWERP_LABEL = { nl_systeem: 'NL-systeem (×1,15)', algemeen: 'algemeen (×1,0)',
  buitenlands: 'buitenlands (×0,85)', onbepaald: 'onbepaald (×1,0)' };
let bronnenGeladen = false;

let BRONNEN_ALLE = [];
async function laadBronnen() {
  bronnenGeladen = true;
  const main = document.getElementById('bMain');
  main.innerHTML = 'Laden…';
  try { BRONNEN_ALLE = await (await fetch('/api/sources')).json(); }
  catch (e) { main.innerHTML = `<div class="banner">Netwerkfout: ${esc(e.message)}</div>`; return; }
  const reviewer = ME && ME.role !== 'bijdrager';
  const nInconsistent = BRONNEN_ALLE.filter(b => (b.problemen || []).length).length;
  main.innerHTML = `<p style="color:var(--text-muted);font-size:12px;max-width:62ch">` + (reviewer
    ? `Classificeren stuurt de score: <b>reliability</b> = rigueur, <b>onderwerp</b> = relevantie voor het Nederlandse mediasysteem (NL-bron weegt zwaarder, buitenlands lichter). De poort weigert een klasse die niet bij het brontype past of — voor een hoge klasse — geen vindplaats heeft.`
    : `Reviewers classificeren bronnen. <b>reliability</b> = rigueur, <b>onderwerp</b> = relevantie voor het NL-mediasysteem. Beide sturen de bronfactor in de score.`) + `</p>`
    + `<div class="filter-chips toolbar" style="margin-bottom:10px">`
    + `<input type="text" id="bZoek" placeholder="Zoek bron…" autocomplete="off" oninput="tekenBronnen()" style="max-width:220px">`
    + `<label style="font-size:12px"><input type="checkbox" id="bOnbepaald" onchange="tekenBronnen()"> nog te classificeren</label>`
    + `<label style="font-size:12px"><input type="checkbox" id="bInconsistent" onchange="tekenBronnen()"> ⚠ inconsistent${nInconsistent ? ` (${nInconsistent})` : ''}</label>`
    + `</div><div id="bTabel"></div>`;
  tekenBronnen();
}

function tekenBronnen() {
  const reviewer = ME && ME.role !== 'bijdrager';
  const zoek = (document.getElementById('bZoek')?.value || '').toLowerCase().trim();
  const enkelOnbep = document.getElementById('bOnbepaald')?.checked;
  const enkelIncons = document.getElementById('bInconsistent')?.checked;
  const sel = (id, opts, cur, labels) => `<select id="${id}">` +
    opts.map(o => `<option value="${o}"${o === cur ? ' selected' : ''}>${labels ? (labels[o] || o) : o}</option>`).join('') + '</select>';
  const rijen = BRONNEN_ALLE.filter(b => {
    if (zoek && !((b.author || '') + ' ' + (b.title || '')).toLowerCase().includes(zoek)) return false;
    if (enkelOnbep && !(b.reliability === 'onbeoordeeld' || b.onderwerp === 'onbepaald')) return false;
    if (enkelIncons && !(b.problemen || []).length) return false;
    return true;
  });
  let h = `<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">${rijen.length} van ${BRONNEN_ALLE.length} bronnen</div>`;
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  h += '<tr style="text-align:left;color:var(--text-dim)"><th></th><th>Bron</th><th>Type</th><th>Reliability</th><th>Onderwerp</th>' + (reviewer ? '<th></th>' : '') + '</tr>';
  for (const b of rijen) {
    const jaar = (b.date_published || '').slice(0, 4);
    const naamTxt = (b.author ? b.author + ', ' : '') + (b.title || 'bron #' + b.id) + (jaar ? ' (' + jaar + ')' : '');
    const naam = b.url
      ? `<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(naamTxt)}</a>`
      : esc(naamTxt);
    const arch = b.archive_url ? ` <a class="arch" href="${esc(b.archive_url)}" target="_blank" rel="noopener" title="webarchief">[archief]</a>` : '';
    const vlag = (b.problemen || []).length
      ? `<span title="${esc(b.problemen.join('; '))}" style="color:#e0a23a;cursor:help">⚠</span>` : '';
    // Voorgestelde classificatie (ik stel voor, jij beslist): telt niet in de score tot
    // een reviewer haar bevestigt. Toon haar als hint en vul de dropdowns ermee voor.
    const heeftRelV = b.reliability_voorgesteld && b.reliability === 'onbeoordeeld';
    const heeftOndV = b.onderwerp_voorgesteld && b.onderwerp === 'onbepaald';
    const voorstelHint = (heeftRelV || heeftOndV)
      ? ` <span style="font-size:10px;color:var(--goud);white-space:nowrap" title="voorgesteld${b.classificatie_voorgesteld_door ? ' door ' + esc(b.classificatie_voorgesteld_door) : ''} — telt niet in de score tot je het bevestigt">💡 voorstel${b.classificatie_voorgesteld_door ? ' · ' + esc(b.classificatie_voorgesteld_door) : ''}</span>`
      : '';
    h += `<tr style="border-top:1px solid var(--border)"><td>${vlag}</td><td style="padding:4px 6px 4px 0">${naam}${arch}${voorstelHint}</td><td>${esc(b.source_type)}</td>`;
    if (reviewer) {
      h += `<td>${sel('rel-' + b.id, RELIABILITY_OPTS, heeftRelV ? b.reliability_voorgesteld : b.reliability)}</td>`;
      h += `<td>${sel('ond-' + b.id, ONDERWERP_OPTS, heeftOndV ? b.onderwerp_voorgesteld : b.onderwerp, ONDERWERP_LABEL)}</td>`;
      h += `<td><button onclick="classificeerBron(${b.id})">bewaar</button> <span id="bmsg-${b.id}"></span></td>`;
    } else {
      const relTxt = heeftRelV ? `onbeoordeeld <span style="color:var(--goud)">→ ${esc(b.reliability_voorgesteld)}?</span>` : esc(b.reliability);
      const ondTxt = heeftOndV ? `onbepaald <span style="color:var(--goud)">→ ${esc(ONDERWERP_LABEL[b.onderwerp_voorgesteld] || b.onderwerp_voorgesteld)}?</span>` : esc(ONDERWERP_LABEL[b.onderwerp] || b.onderwerp);
      h += `<td>${relTxt}</td><td>${ondTxt}</td>`;
    }
    h += '</tr>';
  }
  h += '</table>';
  document.getElementById('bTabel').innerHTML = h;
}

async function classificeerBron(id) {
  const reliability = document.getElementById('rel-' + id).value;
  const onderwerp = document.getElementById('ond-' + id).value;
  const msg = document.getElementById('bmsg-' + id);
  msg.textContent = '…';
  try {
    const resp = await fetch(`/api/sources/${id}/classificatie`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reliability, onderwerp }) });
    const j = await resp.json().catch(() => ({}));
    if (!resp.ok) { msg.innerHTML = `<span style="color:#e0635f">${esc(j.error || 'fout')}</span>`; return; }
    msg.innerHTML = `<span style="color:#3ddc84">opgeslagen</span>`;
    // Ververs de cache (incl. de ⚠-vlag) en herteken na een korte beat, met behoud van de filters.
    try { BRONNEN_ALLE = await (await fetch('/api/sources')).json(); } catch (e) {}
    setTimeout(tekenBronnen, 700);
  } catch (e) { msg.innerHTML = `<span style="color:#e0635f">${esc(e.message)}</span>`; }
}
async function ververs() {
  if (document.getElementById('tab-voorstellen').classList.contains('verborgen')) {
    await laadIndex();
    if (huidig) toonThread(huidig.param, huidig.id, huidig.label); else toonStartkaart();
  } else { laadVoorstellen(); }
}

// ── Auth + bronnen ──
async function init() {
  try {
    const meResp = await fetch('/api/me');
    ME = meResp.ok ? await meResp.json() : null;
  } catch (e) { ME = null; }
  try { ROLLEN = await (await fetch('/api/roles')).json(); } catch (e) { ROLLEN = []; }
  try { BRIDGING = await (await fetch('/api/bridging')).json(); } catch (e) { BRIDGING = null; }
  // Voorstellen-tab enkel voor reviewer+; anders de knop verbergen (server weigert de data toch).
  const tabV = document.getElementById('tabVoorstellen');
  if (tabV) tabV.style.display = magReview() ? '' : 'none';
  laadVoorstellenBadge();
  // Routing: /overleg/voorstel/<id> = eigen voorstel-pagina; #<param>=<id> = thread-permalink;
  // zonder permalink verwelkomt de startkaart (W3.1).
  const vid = huidigeVoorstelId();
  if (vid != null) { toonVoorstelPagina(vid); laadIndex(); return; }  // index op achtergrond klaar
  await laadIndex();
  if (!location.hash || !(await leesHash())) toonStartkaart();
}

// ── Overleg: index ──
async function laadIndex() {
  const lijst = document.getElementById('oLijst');
  lijst.innerHTML = 'Laden…';
  try {
    const resp = await fetch('/api/discussion_index');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    indexData = await resp.json();
    // Leesbare namen (W2.3): rollen/mechanismen komen als snake_case uit de API.
    // Toon de weergavenaam (shared_vocab.weergaveNaam); de ruwe naam blijft in
    // .zoek zodat zoeken op beide werkt. Relatie-labels dragen het relatietype
    // tussen haakjes — alleen dat staartje wordt leesbaar gemaakt.
    ['rollen', 'mechanismen'].forEach(k => (indexData[k] || []).forEach(it => {
      it.zoek = it.label;
      it.label = weergaveNaam(it.label);
    }));
    (indexData.relaties || []).forEach(it => {
      it.label = it.label.replace(/\(([a-z0-9_]+)\)$/,
        (m, t) => '(' + weergaveNaam(t).toLowerCase() + ')');
    });
    tekenToolbar();
    tekenLijst(document.getElementById('oZoek').value);
  } catch (e) {
    lijst.innerHTML = `<div class="leeg">Kon /api/discussion_index niet laden (${esc(e.message)}). Draait <code>server.py</code>?</div>`;
  }
}
function itemHtml(it, param) {
  const act = (huidig && huidig.param === param && huidig.id === it.id) ? ' actief' : '';
  const lab = JSON.stringify(it.label).replace(/"/g, '&quot;');
  // Telling legt zichzelf uit (W3.3): totaal argumenten · waarvan nog 'voorgesteld'
  // (goud = open werk); de legenda boven de lijst geeft dezelfde sleutel.
  const uitleg = `${it.n} argument(en) in deze thread` +
    (it.n_open ? ` · ${it.n_open} nog voorgesteld (wacht op review, telt nog niet mee)` : '');
  return `<div class="t-item${act}" onclick="toonThread('${param}',${it.id},${lab})">` +
    `<span class="t-label" title="${esc(it.label)}">${esc(it.label)}</span>` +
    `<span class="t-n${it.n_open ? ' open' : ''}" title="${esc(uitleg)}">` +
    `${it.n}${it.n_open ? '·' + it.n_open : ''}</span></div>`;
}
// Volgorde van filterwaarden zoals ze in de data voorkomen (canoniek eerst).
function filterVolgordeUit(keys) {
  const gezien = new Set(FILTER_VOLGORDE);
  return FILTER_VOLGORDE.filter(fk => keys.includes(fk))
    .concat(keys.filter(fk => !gezien.has(fk)).sort());
}

// Filterzone (W3.4): één compacte balk — rij 1 zoeken + '● open', rij 2 de soort-
// en filter-select. Zelfde state en gedrag als de oude chip-lagen (actiefSoort/
// actiefFilter/alleenOpen); de accordeons (soort → filter) in de lijst blijven.
function tekenToolbar() {
  if (!indexData) return;
  document.getElementById('oOpenChip').classList.toggle('actief', alleenOpen);

  const soortSel = document.getElementById('oSoortSel');
  let sh = `<option value="__alle__">Alle soorten</option>`;
  GROEPEN.forEach(([key, titel]) => {
    const n = (indexData[key] || []).length;
    if (!n) return;  // lege groepen (bv. entiteiten) tonen we niet
    sh += `<option value="${key}">${esc(titel)} (${n})</option>`;
  });
  soortSel.innerHTML = sh;
  soortSel.value = actiefSoort == null ? '__alle__' : actiefSoort;

  // Filterkeuze alleen tonen als een filterdragende soort in beeld is.
  const filterSel = document.getElementById('oFilterSel');
  const dot = document.getElementById('oFilterDot');
  const toonFilters = actiefSoort == null || actiefSoort === 'relaties' || actiefSoort === 'mechanismen';
  filterSel.style.display = toonFilters ? '' : 'none';
  dot.style.display = toonFilters ? '' : 'none';
  if (!toonFilters) return;
  const fset = new Set();
  GROEPEN.forEach(([key, , , perFilter]) => {
    if (!perFilter || (actiefSoort != null && key !== actiefSoort)) return;
    (indexData[key] || []).forEach(it => fset.add(it.filter || ''));
  });
  const fs = filterVolgordeUit([...fset]);
  let fh = `<option value="__alle__">Alle filters</option>`;
  fs.forEach(fk => {
    fh += `<option value="${fk}">${esc(FILTER_LABEL[fk] != null ? FILTER_LABEL[fk] : fk)}</option>`;
  });
  filterSel.innerHTML = fh;
  filterSel.value = actiefFilter == null ? '__alle__' : actiefFilter;
  // Het gekozen filter komt na een soortwissel mogelijk niet meer voor → terug naar alle.
  if (filterSel.value !== (actiefFilter == null ? '__alle__' : actiefFilter)) {
    actiefFilter = null;
    filterSel.value = '__alle__';
  }
  // Kleurdot naast de select spiegelt het gekozen filter (kleurcode uit de graaf).
  dot.style.background = actiefFilter != null ? (FILTER_KLEUR[actiefFilter] || FILTER_KLEUR['']) : 'transparent';
}

function kiesSoort(key) {
  actiefSoort = (key === '__alle__') ? null : key;
  if (actiefSoort === 'rollen' || actiefSoort === 'emergente_velden') actiefFilter = null;
  tekenToolbar();
  tekenLijst(document.getElementById('oZoek').value);
}
function kiesFilter(arg) {
  actiefFilter = (arg === '__alle__') ? null : arg;
  tekenToolbar();
  tekenLijst(document.getElementById('oZoek').value);
}
function toggleAlleenOpen() {
  alleenOpen = !alleenOpen;
  tekenToolbar();
  tekenLijst(document.getElementById('oZoek').value);
}
function toggleGroep(gkey) {
  if (openGroepen.has(gkey)) openGroepen.delete(gkey); else openGroepen.add(gkey);
  tekenLijst(document.getElementById('oZoek').value);
}

function tekenLijst(filter) {
  const lijst = document.getElementById('oLijst');
  if (!indexData) return;
  const f = (filter || '').toLowerCase().trim();
  const zoekt = !!f;
  // Legenda (W3.3): de badge-telling is informatie, geen geheimtaal.

}

// ── Startkaart (W3.1): zonder permalink toont het rechtervlak meteen iets nuttigs ──
// Drie blokken: wachtrij-tellingen per soort (klikbaar naar de juiste Voorstellen-
// lijst; reviewers zien ze bovenaan), threads met lopende bezwaren (n_bezwaar uit
// /api/discussion_index) en de recentste argumenten (/api/recent_changes, klikbaar
// naar hun thread). Een deeplink (#relation_id=…) opent zoals altijd direct de thread.
function openVoorstellen(t) { kiesVoorstelType(t); kiesTab('voorstellen'); }
function openThreadUitStart(param, id) { toonThread(param, id, labelVoorThread(param, id)); }
async function toonStartkaart() {
  huidig = null;
  zetMobielDetail(false);                                // mobiel: terug naar het lijst-scherm
  tekenLijst(document.getElementById('oZoek').value);   // actieve lijst-markering weghalen
  const d = document.getElementById('oDetail');
  d.innerHTML = '<div style="color:var(--text-muted);padding:24px">Laden…</div>';
  const [queue, feed] = await Promise.all([
    magReview() ? haalReviewQueue(false).catch(() => null) : Promise.resolve(null),
    fetch('/api/recent_changes?limit=120').then(r => r.ok ? r.json() : []).catch(() => []),
  ]);
  if (huidig) return;  // de gebruiker opende ondertussen al een thread

  // (1) Wacht op review — telling per wachtrij-soort, klikbaar naar het Voorstellen-tabblad.
  let wachtHtml = '';
  if (queue && queue.voorstellen) {
    const soorten = [
      ['argumenten', 'Argumenten', (queue.argumenten || []).length],
      ['rfc', 'Theorie', (queue.voorstellen || []).length],
      ['herkeuring', 'Herkeuring', (queue.herkeuring || []).length],
      ['praktijk', 'Praktijk', (queue.entiteiten || []).length + (queue.relaties || []).length],
    ];
    const chips = soorten.map(([t, lbl, n]) =>
      `<span class="fchip" onclick="openVoorstellen('${t}')" title="Open de ${lbl}-wachtrij op het Voorstellen-tabblad">` +
      `${lbl} <span class="wacht-n${n ? ' open' : ''}">${n}</span></span>`).join('');
    wachtHtml = `<div class="start-sectie"><div class="vlabel">Wacht op review` +
      `<button type="button" class="uitleg" aria-label="Uitleg wachtrij" data-uitleg="Alles wat wordt ingediend telt pas mee nadat een reviewer het heeft beoordeeld — tot die tijd staat het hier als open werk (goud). Klik een soort om de wachtrij te openen; meelezen kan ook zonder reviewersrol.">ⓘ</button></div>` +
      `<div class="start-chips">${chips}</div></div>`;
  }

  // (2) Threads met lopende bezwaren — 'argument klopt niet'-reacties die op afhandeling
  // wachten (resolutielus 'open' of 'herzien'); n_bezwaar komt uit de discussie-index.
  const bezwaren = [];
  GROEPEN.forEach(([key, , param]) => ((indexData && indexData[key]) || []).forEach(it => {
    if (it.n_bezwaar > 0) bezwaren.push({ param, id: it.id, label: it.label, n: it.n_bezwaar });
  }));
  bezwaren.sort((a, b) => b.n - a.n);
  const bezwaarHtml = !bezwaren.length ? '' :
    `<div class="start-sectie"><div class="vlabel">Threads met lopende bezwaren` +
    `<button type="button" class="uitleg" aria-label="Uitleg bezwaren" data-uitleg="Een bezwaar ('argument klopt niet') dempt de kracht van een argument tot het is afgehandeld — van een admin nult het de punten zelfs volledig: de auteur past het argument aan ('herzien'), waarna de bezwaarmaker het bezwaar sluit ('opgelost') of laat staan ('blijft'). Deze threads hebben bezwaren die nog op zo'n stap wachten.">ⓘ</button></div>` +
    bezwaren.slice(0, 6).map(b =>
      `<div class="t-item" onclick="openThreadUitStart('${b.param}',${b.id})">` +
      `<span class="t-label" title="${esc(b.label)}">${esc(b.label)}</span>` +
      `<span class="t-n open" title="${b.n} lopende ondergraving(en) die op afhandeling wachten">⚑ ${b.n}</span></div>`).join('') + `</div>`;

  // (3) Recente activiteit — nieuwste argumenten (nieuw of gemerged), één regel per
  // argument (dedupe op record_id; de feed is nieuwste-eerst).
  const gezien = new Set();
  const recent = [];
  for (const r of (feed || [])) {
    if (r.table_name !== 'arguments' || (r.action !== 'created' && r.action !== 'merged')) continue;
    if (!r.thread_param || !r.thread_id || !r.claim) continue;   // bv. inmiddels verwijderd
    if (gezien.has(r.record_id)) continue;
    gezien.add(r.record_id);
    recent.push(r);
    if (recent.length >= 6) break;
  }
  const recentHtml = `<div class="start-sectie"><div class="vlabel">Recente activiteit</div>` +
    (recent.length ? recent.map(r => {
      const [sym, kleur] = STANCE[r.stance] || ['•', '#888'];
      const actie = r.action === 'merged'
        ? '<span style="color:var(--ok)">gemerged</span>'
        : '<span style="color:var(--goud)">nieuw</span>';
      const doelNaam = (r.doel_type === 'rol' || r.doel_type === 'mechanisme')
        ? weergaveNaam(r.doel_naam) : r.doel_naam;
      return `<div class="start-item" onclick="openThreadUitStart('${r.thread_param}',${r.thread_id})" title="Open deze thread">` +
        `<div class="si-claim"><span class="stance" style="color:${kleur}">${sym}</span> ${esc(r.claim)}</div>` +
        `<div class="si-meta">${actie} · ${esc(r.changed_by || '?')} · ${esc((r.created_at || '').slice(0, 16))}${doelNaam ? ' · ' + esc(r.doel_type) + ': ' + esc(doelNaam) : ''}</div></div>`;
    }).join('') : `<div class="leeg">Nog geen recente argumenten.</div>`) + `</div>`;

  // Reviewers zien hun wachtrij bovenaan; anderen eerst het leven in het model.
  const isReviewer = ME && ME.role !== 'bijdrager';
  const secties = isReviewer ? [wachtHtml, bezwaarHtml, recentHtml]
                             : [recentHtml, bezwaarHtml, wachtHtml];
  d.innerHTML = `<div class="start-kaart"><h2>Overleg</h2>` +
    `<p class="start-intro">Kies links een relatie, entiteit, rol, mechanisme of emergent veld om de thread (argumentboom) rustig te lezen — of voeg er een argument aan toe.</p>` +
    secties.join('') + `</div>`;
}

// ── Toevoegformulier (root of reply) ──
const SOURCE_TYPE_OPTS = ['boek', 'academisch_artikel', 'rapport', 'nieuwsartikel', 'transcript',
  'interview', 'dataset', 'wetgeving', 'persbericht', 'website', 'overig'];
// Bron-typeahead: i.p.v. één dropdown met álle bronnen (schaalt niet naar duizenden)
// zoeken we serverzijdig op titel/auteur. Het verborgen veld `${fid}-src` houdt de keuze
// ('' / '__new__' / id) zodat verstuur() ongewijzigd blijft. "+ nieuwe bron" staat bovenaan.
const _bronZoekTimer = {};
function zoekBron(fid) {
  const inp = document.getElementById(fid + '-bronzoek');
  const lijst = document.getElementById(fid + '-bronlijst');
  if (!inp || !lijst) return;
  // Tekst wijzigen = keuze loslaten. Maar bij louter focussen (tekst onveranderd t.o.v. het
  // gekozen label) houden we de keuze vast — anders verlies je een voorgevulde bron zodra je
  // het veld aanraakt.
  const srcEl = document.getElementById(fid + '-src');
  if (srcEl && inp.value.trim() !== (srcEl.dataset.chosenlabel || '')) { srcEl.value = ''; srcEl.dataset.chosenlabel = ''; }
  const metNieuw = inp.closest('.bronkies')?.dataset.metnieuw !== '0';
  const blok = document.getElementById(fid + '-nieuwbron');
  if (blok) blok.style.display = 'none';
  const term = inp.value.trim();
  clearTimeout(_bronZoekTimer[fid]);
  _bronZoekTimer[fid] = setTimeout(async () => {
    let bronnen = [];
    if (term.length >= 2) {
      try { bronnen = await (await fetch('/api/sources?limit=15&q=' + encodeURIComponent(term))).json(); }
      catch (e) { bronnen = []; }
    }
    let h = metNieuw ? `<div class="bron-optie nieuw" onclick="kiesBron('${fid}','__new__')">+ nieuwe bron toevoegen…</div>` : '';
    if (term.length < 2) h += `<div class="bron-leeg">Typ minstens 2 letters om te zoeken…</div>`;
    else if (!bronnen.length) h += `<div class="bron-leeg">Geen bron gevonden${metNieuw ? ' — voeg er een toe.' : '.'}</div>`;
    else h += bronnen.map(b => {
      const label = esc((b.author ? b.author + ' — ' : '') + (b.title || 'bron #' + b.id));
      return `<div class="bron-optie" data-label="${label}" onclick="kiesBron('${fid}',${b.id},this.dataset.label)">${label}</div>`;
    }).join('');
    lijst.innerHTML = h;
    lijst.style.display = '';
  }, 200);
}
function kiesBron(fid, val, label) {
  const srcEl = document.getElementById(fid + '-src');
  srcEl.value = val;
  const inp = document.getElementById(fid + '-bronzoek');
  const lijst = document.getElementById(fid + '-bronlijst');
  const blok = document.getElementById(fid + '-nieuwbron');
  if (val === '__new__') { if (inp) inp.value = ''; srcEl.dataset.chosenlabel = ''; if (blok) blok.style.display = ''; }
  else { if (inp) inp.value = label || ''; srcEl.dataset.chosenlabel = label || ''; if (blok) blok.style.display = 'none'; }
  if (lijst) { lijst.style.display = 'none'; lijst.innerHTML = ''; }
}
// Klik buiten het zoekveld sluit de resultatenlijst.
document.addEventListener('click', e => {
  if (e.target.closest('.bronkies')) return;
  document.querySelectorAll('.bron-resultaten').forEach(l => { l.style.display = 'none'; });
});

// ── Meerdere bronnen per argument ───────────────────────────
// Elke citatie-RIJ heeft een eigen id, zodat zoekBron/kiesBron per rij werken. Een
// "+ bron toevoegen"-knop voegt rijen toe; collectOCites() leest ze allemaal uit.
// metNieuw=true → de rij laat ook een nieuwe bron + optionele URL toe.
let _oCiteSeq = 0;
// cite (optioneel) = een bestaande citatie om voor te vullen: bron geselecteerd, citaat
// ingevuld, en page/section/context als verborgen velden zodat ze bij een vervang-ronde
// niet verloren gaan (resolveOCite leest ze terug).
function oCiteRowHtml(rid, removable, metNieuw, cite) {
  const heeft = !!(cite && cite.source_id);
  const label = heeft ? esc((cite.source_author ? cite.source_author + ' — ' : '') + (cite.source_title || 'bron #' + cite.source_id)) : '';
  const verborgen = heeft
    ? `<input type="hidden" id="${rid}-page" value="${esc(cite.page || '')}">` +
      `<input type="hidden" id="${rid}-section" value="${esc(cite.section || '')}">` +
      `<input type="hidden" id="${rid}-context" value="${esc(cite.context || '')}">` : '';
  return `<div class="cite-row" data-rowid="${rid}" style="position:relative;border-left:2px solid var(--border);padding-left:10px;margin-bottom:10px">
      ${removable ? `<button type="button" title="Deze bron verwijderen" onclick="removeOCiteRow('${rid}')" style="position:absolute;top:-2px;right:0;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;line-height:1">×</button>` : ''}
      <div class="rij2">
        <div><label>Bron</label>
          <div class="bronkies" data-metnieuw="${metNieuw ? 1 : 0}">
            <input type="hidden" id="${rid}-src" value="${heeft ? cite.source_id : ''}" data-chosenlabel="${label}">
            <input type="text" id="${rid}-bronzoek" autocomplete="off" value="${label}" placeholder="Zoek op titel of auteur${metNieuw ? ', of voeg een bron toe' : ''}…"
                   oninput="zoekBron('${rid}')" onfocus="zoekBron('${rid}')">
            <div class="bron-resultaten" id="${rid}-bronlijst" style="display:none"></div>
          </div></div>
        <div><label>Citaat (optioneel)</label><input type="text" id="${rid}-quote" value="${heeft ? esc(cite.quote || '') : ''}" placeholder="Letterlijk citaat uit de bron (optioneel)"></div>
      </div>
      <div style="margin-top:6px"><label>URL / vindplaats (optioneel)</label><input type="text" id="${rid}-nurl" value="${heeft ? esc(cite.url || '') : ''}" data-orig="${heeft ? esc(cite.url || '') : ''}" placeholder="https://… — voor een nieuwe bron, óf om een gekozen bron verifieerbaar te maken"></div>
      ${verborgen}
      ${metNieuw ? `<div id="${rid}-nieuwbron" style="display:none;border:1px dashed var(--border);border-radius:6px;padding:8px;margin-top:6px">
        <div class="rij2">
          <div><label>Titel nieuwe bron *</label><input type="text" id="${rid}-ntitel" placeholder="bv. WRR — Aandacht voor media"></div>
          <div><label>Brontype</label><select id="${rid}-ntype">${SOURCE_TYPE_OPTS.map(t => `<option value="${t}">${t}</option>`).join('')}</select></div>
        </div>
      </div>` : ''}
    </div>`;
}
// cites (optioneel) = bestaande citaties om voor te vullen: elk wordt een verwijderbare rij
// (prefix __p, botst niet met de __r-rijen die addOCiteRow aanmaakt). data-prefilled markeert
// dat het formulier de bronnen draagt, zodat de verzender de set als gezaghebbend behandelt.
function oCiteListHtml(fid, metNieuw, cites) {
  cites = (cites || []).filter(c => c && c.source_id);
  const rijen = cites.length
    ? cites.map((c, i) => oCiteRowHtml(fid + '__p' + i, true, metNieuw, c)).join('')
    : oCiteRowHtml(fid + '__r0', false, metNieuw);
  return `<div class="cite-list" id="${fid}-cites"${cites.length ? ' data-prefilled="1"' : ''}>${rijen}</div>
    <button type="button" class="reageer-knop" onclick="addOCiteRow('${fid}',${metNieuw ? 'true' : 'false'})" style="font-size:12px;margin-bottom:8px">+ bron toevoegen</button>`;
}
function addOCiteRow(fid, metNieuw) {
  const list = document.getElementById(fid + '-cites'); if (!list) return;
  const w = document.createElement('div');
  w.innerHTML = oCiteRowHtml(fid + '__r' + (++_oCiteSeq), true, metNieuw).trim();
  list.appendChild(w.firstElementChild);
}
function removeOCiteRow(rid) { const r = document.querySelector(`.cite-row[data-rowid="${rid}"]`); if (r) r.remove(); }
// Eén rij → {source_id, quote} | null (leeg) | false (fout). Maakt zo nodig een nieuwe bron aan.
async function resolveOCite(rid, msg) {
  const srcEl = document.getElementById(rid + '-src'); if (!srcEl) return null;
  const src = srcEl.value;
  const quote = (document.getElementById(rid + '-quote')?.value || '').trim() || null;
  const nurl = (document.getElementById(rid + '-nurl')?.value || '').trim();
  if (src === '__new__') {
    const ntitel = (document.getElementById(rid + '-ntitel')?.value || '').trim();
    const ntype = document.getElementById(rid + '-ntype')?.value || 'overig';
    if (!ntitel) { if (msg) msg.innerHTML = '<span style="color:#e0635f">Titel van de nieuwe bron is verplicht.</span>'; return false; }
    const nbody = { title: ntitel, source_type: ntype };
    if (nurl) nbody.location = { type: 'url', value: nurl };
    try {
      const br = await fetch('/api/sources', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(nbody) });
      const bj = await br.json().catch(() => ({}));
      if (!br.ok) { if (msg) msg.innerHTML = `<span style="color:#e0635f">${esc(bj.error || 'bron aanmaken mislukt')}</span>`; return false; }
      return { source_id: bj.id, quote };
    } catch (e) { if (msg) msg.innerHTML = `<span style="color:#e0635f">Netwerkfout: ${esc(e.message)}</span>`; return false; }
  } else if (src) {
    const id = parseInt(src, 10);
    // Optionele URL bij een BESTAANDE bron → als vindplaats toevoegen (dedupt server-side).
    // Een voorgevulde, ongewijzigde URL slaan we over: die vindplaats staat al op de bron (en
    // bij een doi/handle is de getoonde link niet de ruwe locator — opnieuw posten zou dubbelen).
    const origUrl = (document.getElementById(rid + '-nurl')?.dataset.orig || '').trim();
    if (nurl && nurl !== origUrl) { try { await fetch(`/api/sources/${id}/locations`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'url', value: nurl }) }); } catch (e) {} }
    const c = { source_id: id, quote };
    // Verborgen velden van een voorgevulde citatie meenemen, zodat _zet_citaties ze niet wist.
    for (const k of ['page', 'section', 'context']) {
      const v = (document.getElementById(rid + '-' + k)?.value || '').trim();
      if (v) c[k] = v;
    }
    return c;
  }
  return null;
}
async function collectOCites(fid, msg) {
  const list = document.getElementById(fid + '-cites'); if (!list) return [];
  const out = [];
  for (const row of list.querySelectorAll('.cite-row')) {
    const c = await resolveOCite(row.dataset.rowid, msg);
    if (c === false) return false;
    if (c) out.push(c);
  }
  return out;
}
function formHtml(opts) {
  const fid = 'f' + Math.random().toString(36).slice(2, 8);

  //   1. Ondergraving-modus ('✗ Argument klopt niet'): stance vast op − Tegen, GEEN
  //      bronvelden (een bezwaar vergt geen bron), wél een vrij categorie-veld.
  //   2. Bewijs-modus ('Bewijs/tegenbewijs gevonden'): vóór of tegen, mét bron (verplicht).
  const ondergraving = !!opts.ondergraving;
  // Kruimelpad: maakt de plek in de boom expliciet — je hangt een tak onder dít argument.
  const parentArg = reply ? (ctx(opts.ck).map().get(opts.parent_argument_id) || {}) : null;
  const kruimel = parentArg ? `<div class="reply-kruimel">↳ je ${ondergraving ? 'ondergraaft' : 'reageert op'} <b>«${esc((parentArg.claim || '').slice(0, 100))}${(parentArg.claim || '').length > 100 ? '…' : ''}»</b></div>` : '';

  // vast en tonen we een statisch label.
  const pre = reply ? (opts.stance || 'supporting') : null;
  const stKnop = (st, cls, lbl) => `<button type="button" class="${pre === st ? cls : ''}" onclick="kiesStance('${fid}','${st}',this)">${lbl}</button>`;
  const stanceBlok = ondergraving
    ? `<div class="stance-kies vast" id="${fid}-st" data-stance="contradicting"><span class="stance-vast">− Tegen — ‘argument klopt niet’</span></div>`
    : `<div class="stance-kies" id="${fid}-st"${pre ? ` data-stance="${pre}"` : ''}>
      ${stKnop('supporting', 'sel-sup', reply ? '＋ Bewijs vóór' : '+ Voor')}

  const stanceHint = ondergraving
    ? `<div style="font-size:11px;color:var(--text-muted);margin:2px 0 6px">Geen bron nodig — benoem wat er niet klopt; dit ${ME && ME.role === 'maintainer' ? 'nult als admin-oordeel de punten van het argument volledig' : 'dempt de kracht'} tot het bezwaar is <b>opgelost</b>.</div>`
    : (reply ? `<div style="font-size:11px;color:var(--text-muted);margin:2px 0 6px">Bewijs of tegenbewijs vergt minstens één <b>bron</b> — kies vóór of tegen.</div>` : '');
  const catVeld = ondergraving
    ? `<label>Categorie bezwaar <span style="text-transform:none;color:var(--text-muted)">(optioneel, vrij veld)</span></label>
    <input type="text" id="${fid}-cat" placeholder="bv. drogreden (stroman, cirkelredenering…), citaat dekt claim niet, verouderde bron">`
    : '';
  return `<div class="form" id="${fid}" data-target='${JSON.stringify(opts).replace(/'/g, "&#39;")}'>
    <h4>${ondergraving ? 'Argument klopt niet — zeg waarom' : (reply ? 'Bewijs/tegenbewijs gevonden — vóór of tegen dit argument' : 'Nieuw argument')}</h4>
    ${kruimel}
    ${stanceBlok}
    ${stanceHint}
    <label>Bewering *</label>
    <input type="text" id="${fid}-claim" placeholder="${ondergraving ? 'De kern van je bezwaar, kort en bondig' : (reply ? 'Wat laat de bron zien, kort en bondig' : 'De kernbewering, kort en bondig')}">
    <label>Onderbouwing${ondergraving ? ' <span style="text-transform:none;color:var(--text-muted)">(verplicht — benoem wat er niet klopt)</span>' : (reply ? ' <span style="text-transform:none;color:var(--text-muted)">(verplicht bij Tegenbewijs)</span>' : '')}</label>
    <textarea id="${fid}-reason" placeholder="${ondergraving ? 'Wat klopt er niet aan dit argument, en waarom?' : 'Redenering of toelichting'}"></textarea>
    ${catVeld}
    ${reply ? '' : `<div class="rij2">
      <div><label>Eigenschap (optioneel)</label>

          <option value="certainty">zekerheid</option>

          <option value="description">beschrijving</option>

        <input type="text" id="${fid}-propval" placeholder="bv. 0.1"></div>

    ${ondergraving ? '' : `<div style="font-size:11px;color:var(--text-muted);margin:-2px 0 6px">Meerdere bronnen mogen — gebruik <b>+ bron toevoegen</b>. Een nieuwe bron landt meteen als referentie; een reviewer classificeert betrouwbaarheid/onderwerp later (tab <b>Bronnen</b>). Een vindplaats (URL) maakt het citaat meteen verifieerbaar.</div>`}
    <div style="margin-top:12px"><button class="prim" onclick="verstuur('${fid}')">${ME && ME.role === 'maintainer' ? 'Toevoegen — telt meteen (admin)' : 'Indienen als voorstel'}</button>
      ${reply ? `<button onclick="document.getElementById('${fid}').remove()">Annuleren</button>` : ''}</div>
    <div class="melding" id="${fid}-msg"></div>
  </div>`;
}
// Open/wissel/sluit de reageer-composer in de reply-slot. Zelfde ingang nogmaals = sluiten.
// Twee ingangen, één composer: '⇄ Bewijs/tegenbewijs gevonden' (⋯-menu) geeft de
// vóór/tegen-keuze mét bronvelden, '✗ Argument klopt niet' (oordeel-paar,
// ondergraving=true) zet 'm vast op − Tegen, zonder bronvelden.
function toonReply(argId, stance, ondergraving, ck) {
  ck = ck || '';
  const slot = document.getElementById(replySlot(ck, argId));
  if (!slot) return;
  stance = stance || 'supporting';
  // Toggle-sleutel onderscheidt de twee ingangen, zodat 'Bewijs/tegenbewijs' en 'Argument
  // klopt niet' elkaar niet voor 'al open' aanzien (en nogmaals klikken op dezelfde knop sluit).

async function verstuur(fid) {

  const stance = document.getElementById(fid + '-st').dataset.stance;

  if (reply && stance === 'contradicting' && !reason) { msg.innerHTML = `<span style="color:#e0635f">${opts.ondergraving ? '‘Argument klopt niet’ vereist onderbouwing: benoem wat er niet klopt aan het argument.' : 'Tegenbewijs vereist onderbouwing: zeg wat de bron weerspreekt.'}</span>`; return; }
  msg.textContent = 'Bron(nen) verwerken…';

  if (citations === false) return;
  // Bewijs/tegenbewijs is per definitie gesourcet; de ondergraving juist bronloos.
  if (reply && !opts.ondergraving && !citations.length) { msg.innerHTML = '<span style="color:#e0635f">Bewijs/tegenbewijs vergt minstens één bron — voeg een bron met vindplaats of citaat toe. Klopt het argument gewoon niet? Gebruik dan ‘✗ Argument klopt niet’ (geen bron nodig).</span>'; return; }
  const catEl = document.getElementById(fid + '-cat');

  const propvalEl = document.getElementById(fid + '-propval');
  const property_value = (!reply && propvalEl && property) ? (propvalEl.value.trim() || null) : null;
  const body = {
    relation_id: reply ? null : (opts.param === 'relation_id' ? opts.id : null),
    entity_id: reply ? null : (opts.param === 'entity_id' ? opts.id : null),
    role_id: reply ? null : (opts.param === 'role_id' ? opts.id : null),
    mechanism_id: reply ? null : (opts.param === 'mechanism_id' ? opts.id : null),
    emergent_effect_id: reply ? null : (opts.param === 'emergent_effect_id' ? opts.id : null),
    parent_argument_id: opts.parent_argument_id || null,
    objection_type: (opts.ondergraving && catEl) ? (catEl.value.trim() || null) : null,
    stance, claim, reasoning: reason || null, property, property_value, citations,
  };
  msg.textContent = 'Indienen…';
  try {
    const resp = await fetch('/api/arguments', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const j = await resp.json();
    if (!resp.ok) { msg.innerHTML = `<span style="color:#e0635f">${esc(j.error)}</span>`; return; }
    msg.innerHTML = j.status === 'voorgesteld'
      ? `<span style="color:#3ddc84">Ingediend als voorstel (status: ${esc(j.status)}). Telt mee na review.</span>`
      : `<span style="color:#3ddc84">Toegevoegd en meteen gemerged (admin, status: ${esc(j.status)}).</span>`;
    setTimeout(() => { ctxHerlaad(opts.ck); laadIndex(); laadVoorstellenBadge(); }, 900);
  } catch (e) { msg.innerHTML = `<span style="color:#e0635f">Netwerkfout: ${esc(e.message)}</span>`; }
}

// ── Voorstellen (review) ──
// Derde element = uitleg-tooltip (ⓘ) voor de jargon-zware velden.
const LANGEVELDEN = [

const METAVELDEN = [

  ['aard', 'aard', 'Hoe "echt" de verbinding is — bepaalt of ze als pijl, halo of goud veld in de graaf wordt getekend (zie de freeze-test hieronder).'],
  ['mechanisme_type', 'mechanisme-type', 'Subtype van het mechanisme.'],
  ['categorie', 'categorie', 'Categorie/cluster waar het element bij hoort.'],

// Leesbare labels + uitleg per 'aard'. De symbolen spiegelen hoe het in de graaf oogt.
const AARD = {
  direct:            ['→ direct effect (pijl)',       'Een gewone, getekende verbinding van bron → doel; zo verschijnt ze als pijl in de graaf.'],
  veld_eigenschap:   ['◯ veld-eigenschap (halo)',     'Een staande toestand van één knoop zonder aanwijsbare live-zender (bv. zelfcensuur); getekend als ring om het doel, niet als pijl.'],
  veld_instantiatie: ['veld-instantiatie (verouderd)','Verouderde aard — wordt nu als gewone directe pijl getekend.'],
  indirect:          ['indirect (verouderd)',         'Verouderde aard — indirectheid hoort bij een pad, niet bij één pijl; wordt nu als directe pijl getekend.'],
};
const aardLabel = a => AARD[a] || [String(a ?? ''), ''];
const rolNaam = id => { const r = (ROLLEN || []).find(x => String(x.id) === String(id)); return r ? weergaveNaam(r.name) : `rol #${id}`; };
// Eén gedeelde review_queue-fetch voor de tab-badge én de startkaart (W3.1):

function rendBron(b) {
  // Bronnen komen in twee vormen voor: losse strings (oudere RfC's) of objecten
  // met auteur/titel/jaar/uitgever/type + toelichting of relevantie. Een URL (apart
  // veld of een kale link in de tekst) wordt klikbaar gemaakt — net als bij citaties.
  if (typeof b === 'string') return linkify(b);
  if (!b || typeof b !== 'object') return esc(String(b ?? 'bron'));
  const kop = [b.auteur, b.titel].filter(Boolean).map(esc).join(' — ') || 'bron';
  const url = b.url || b.link || (b.doi ? `https://doi.org/${b.doi}` : '')
    || (b.handle ? `https://hdl.handle.net/${b.handle}` : '');
  const kopHtml = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${kop}</a>` : kop;
  const arch = b.archive_url ? ` <a class="arch" href="${esc(b.archive_url)}" target="_blank" rel="noopener" title="webarchief">[archief]</a>` : '';
  const sub = [b.jaar, b.uitgever, b.type].filter(Boolean).map(esc).join(', ');
  const toel = b.toelichting || b.relevantie || '';
  return kopHtml + (sub ? ` <span class="cite-src">(${sub})</span>` : '') + arch +
    (toel ? `<div style="color:var(--text-muted);font-size:11.5px;margin-top:1px">${linkify(toel)}</div>` : '');
}
function rendInstantiatie(i) {
  // Beoogde instantiaties komen in drie vormen voor: een platte string (oudere RfC's),
  // {rol, beschrijving} (theorie-instantiatie op een rol) of {entity_id/relation_id, toelichting}.
  // Vang ze alle drie af, anders blijft het bolletje leeg.
  if (typeof i === 'string') return esc(i);
  if (!i || typeof i !== 'object') return esc(String(i ?? ''));
  const tekst = i.toelichting || i.beschrijving || i.motivatie || i.relevantie || '';
  const refs = [];
  if (i.entity_id) refs.push(`entiteit #${esc(i.entity_id)}`);
  if (i.relation_id) refs.push(`relatie #${esc(i.relation_id)}`);
  if (i.rol) refs.push(`rol: ${esc(i.rol)}`);
  if (i.role_id) refs.push(`rol #${esc(i.role_id)}`);
  if (i.mechanism_id) refs.push(`mechanisme #${esc(i.mechanism_id)}`);
  const ref = refs.length ? ` <code>${refs.join(', ')}</code>` : '';
  // Niets herkend → toon de ruwe inhoud zodat het bolletje nooit leeg is.
  if (!tekst && !refs.length) return esc(JSON.stringify(i));
  return `${esc(tekst)}${ref}`;
}
function rendVoorstel(v) {

  // Quorum-telling legt zichzelf uit (W3.3): X van de Y benodigde reviewer-akkoorden.

    `<span title="${akk} van de ${v.benodigde_akkoorden} benodigde akkoorden"><b>${akk}/${v.benodigde_akkoorden}</b> akkoord` +
    `<button type="button" class="uitleg" aria-label="Uitleg akkoord-telling" data-uitleg="Tot nu toe ${akk} reviewer-akkoord(en) van de ${v.benodigde_akkoorden} die dit voorstel nodig heeft; bij het quorum wordt het geaccepteerd en ontstaat het element echt. De indiener telt niet mee en agent-oordelen zijn zichtbaar advies dat nooit meetelt. In de opbouwfase geldt één maintainer-akkoord als volledig quorum (gevlagd).">ⓘ</button></span>` +
    `<span>${v.theorielaag ? 'theorielaag — 2 menselijke reviewers' : 'praktijklaag — 1 reviewer'}</span></div>`;
  const tagHtml = (label, value, tip) =>

  const tags = METAVELDEN.filter(([k]) => p[k] != null && p[k] !== '').map(([k, l, tip]) => {
    if (k === 'aard') { const [al, atip] = aardLabel(p[k]); return tagHtml(l, al, atip || tip); }
    return tagHtml(l, p[k], tip);
  });
  // Verbinding bron → doel (rollen, op naam) als één duidelijke richtings-tag vooraan —
  // zo is meteen zichtbaar tussen welke rollen de pijl loopt.
  if (p.source_role_id || p.target_role_id) {
    const bron = p.source_role_id ? rolNaam(p.source_role_id) : '—';
    const doel = p.target_role_id ? rolNaam(p.target_role_id) : '—';
    tags.unshift(`<span class="tag" title="De verbinding loopt van bron-rol naar doel-rol — de richting van de pijl" style="cursor:help">${esc(bron)} <b>→</b> ${esc(doel)} <span style="opacity:.45;font-weight:400">ⓘ</span></span>`);
  }

  LANGEVELDEN.forEach(([k, l, help]) => { if (p[k]) h += `<div class="veld"><div class="vlabel"${help ? ` title="${esc(help)}" style="cursor:help"` : ''}>${l}${help ? ' <span style="color:var(--text-muted);font-weight:400">ⓘ</span>' : ''}</div><div class="vwaarde">${esc(p[k])}</div></div>`; });
  if (p.leden?.length) h += `<div class="veld"><div class="vlabel" title="Een emergent veld spant zich over rollen (theorielaag), niet over losse entiteiten — dit zijn de dragende rollen die het veld omvat" style="cursor:help">Leden — rollen die dit veld omvat (${p.leden.length}) <span style="color:var(--text-muted);font-weight:400">ⓘ</span></div><div class="vwaarde">${p.leden.map(id => esc(rolNaam(id))).join(' · ')}</div></div>`;
  if (p.deel_van) h += `<div class="veld"><div class="vlabel" title="Bij acceptatie wordt dit veld als deel-effect onder het apex-veld met dit id gehangen (emergent_effect_subeffects)" style="cursor:help">Deel-effect van veld #${esc(p.deel_van)} <span style="color:var(--text-muted);font-weight:400">ⓘ</span></div></div>`;

  if (p.bronnen?.length) h += `<div class="veld"><div class="vlabel">Bronnen (${p.bronnen.length})</div><ul class="lijst">` +

  if (p.opvolgers?.length) h += `<div class="veld"><div class="vlabel">Opvolger-definities</div><ul class="lijst">` +
    p.opvolgers.map(o => `<li><b>${esc(o.naam || '')}</b> — ${esc(o.definitie || '')}</li>`).join('') + `</ul></div>`;
  const bekend = new Set(LANGEVELDEN.map(x => x[0]).concat(METAVELDEN.map(x => x[0]), ['instantiaties', 'bronnen', 'opvolgers', 'voorbeelden', 'leden', 'deel_van']));
  const rest = Object.keys(p).filter(k => !bekend.has(k) && p[k] != null && p[k] !== '');
  if (rest.length) h += `<div class="veld"><div class="vlabel">Overige velden</div><div class="vwaarde">` +
    esc(rest.map(k => `${k}: ${typeof p[k] === 'object' ? JSON.stringify(p[k]) : p[k]}`).join('\n')) + `</div></div>`;
  if (t.akkoorden.length || t.afwijzingen.length || t.advies.length) {

    if (t.akkoorden.length) r += `✓ akkoord: ${t.akkoorden.map(esc).join(', ')}\n`;

    h += `<div class="veld"><div class="vlabel">Reviews</div><div class="vwaarde">${r}</div>`;

      const sym = rv.oordeel === 'akkoord' ? '✓' : (rv.oordeel === 'afwijzen' ? '✕' : '•');

        `<b style="color:var(--text-muted);font-weight:600">${sym} ${esc(rv.reviewer)}${advies}</b> — ${esc(rv.motivatie)}</div>`;

    h += `<div class="acties"><button class="akkoord" onclick="beoordeel(${v.id},'akkoord')">Akkoord</button>` +
      `<button class="afwijzen" onclick="beoordeel(${v.id},'afwijzen')">Afwijzen</button>` +
      `<span class="uitslag" id="vst-${v.id}-uit"></span></div>`;

    // opnieuw indienen: een nieuw 'open' voorstel, voorgevuld uit dit voorstel (herkomst bewaard).
    const magHerzien = (v.status === 'afgewezen' || v.status === 'ingetrokken')

    if (magHerzien) h += ` <button class="akkoord" onclick="herzienVoorstel(${v.id})" ` +
      `title="Maakt een nieuw open voorstel, voorgevuld uit dit voorstel — pas het aan op basis van de feedback hierboven">Verbeteren &amp; opnieuw indienen</button>`;
    if ((v.status === 'afgewezen' || v.status === 'ingetrokken') && ME && ME.role === 'maintainer')
      h += ` <button class="afwijzen" onclick="verwijderVoorstel(${v.id})" title="Hard verwijderen uit de database — onomkeerbaar, geen audit-spoor">Verwijderen</button>`;
    h += `<span class="uitslag" id="vst-${v.id}-uit"></span>`;

async function herzienIndienen(vid) {

  if (uit) uit.textContent = ' bezig…';
  try {
    const v = await (await fetch(`/api/voorstellen/${vid}`)).json();  // canonieke payload als basis
    const p = JSON.parse(JSON.stringify(v.payload || {}));            // onbewerkte velden blijven behouden
    const lees = k => { const el = document.getElementById(`hz-${vid}-${k}`); if (el) p[k] = el.value.trim(); };
    ['naam', 'label', 'filter', 'categorie', 'aard', 'definitie', 'effect', 'afgrenzing',
     'falsificatiecriterium', 'freeze_test', 'description', 'motivatie'].forEach(lees);
    const led = document.getElementById(`hz-${vid}-leden`);
    if (led) p.leden = Array.from(led.selectedOptions).map(o => parseInt(o.value, 10));
    const lijst = id => { const el = document.getElementById(id); return el ? el.value.split('\n').map(s => s.trim()).filter(Boolean) : null; };
    const inst = lijst(`hz-${vid}-instantiaties`); if (inst) p.instantiaties = inst;
    const bron = lijst(`hz-${vid}-bronnen`); if (bron) p.bronnen = bron;
    const tEl = document.getElementById(`hz-${vid}-titel`);
    const titel = tEl ? tEl.value.trim() : (v.titel || '');
    const r = await fetch(`/api/voorstellen/${vid}/herzien`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ payload: p, titel }),
    });
    const j = await r.json();
    if (!r.ok) { if (uit) uit.innerHTML = ` <span style="color:#e0635f">${esc((j.fouten || []).join('; ') || j.error || 'Mislukt')}</span>`; return; }
    location.href = `/overleg/voorstel/${j.id}`;  // de nieuwe, bewerkte RfC

}
