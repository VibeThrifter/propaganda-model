  try {
    const resp = await fetch(`/api/voorstellen/${vid}/reviews`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oordeel, motivatie }),
    });
    const j = await resp.json();
    if (resp.status === 409) { uit.innerHTML = `<span style="color:#f0a030">Geblokkeerd: ${esc(j.blokkade)}</span>`; return; }
    if (!resp.ok) { uit.innerHTML = `<span style="color:#e0635f">${esc(j.error)}</span>`; return; }
    const b = j.besluit;
    uit.innerHTML = b === 'open' ? '<span style="color:var(--text-dim)">Oordeel vastgelegd; blijft open.</span>'
      : `<span style="color:${b === 'geaccepteerd' ? '#3ddc84' : '#e0635f'}">Voorstel ${esc(b)}.${b === 'geaccepteerd' ? ' Regenereer de viz voor nieuwe theorie-elementen.' : ''}</span>`;
    setTimeout(() => { laadVoorstellen(); laadVoorstellenBadge(); }, 1000);
  } catch (e) { uit.innerHTML = `<span style="color:#e0635f">Netwerkfout: ${esc(e.message)}</span>`; }
}
async function scoreDiff(id) {
  const uit = document.getElementById(`arg-${id}-uit`); uit.textContent = 'Rekenen…';
  try {
    const d = await (await fetch(`/api/arguments/${id}/score_diff`)).json();
    if (!d.diff) { uit.textContent = d.error || 'geen diff'; return; }
    uit.textContent = d.diff.length ? 'Mergen verschuift: ' + d.diff.slice(0, 5).map(x =>
      `${x.naam || x.categorie + ' #' + x.id} ${Math.round(x.voor * 100)}%→${Math.round(x.na * 100)}%`).join(' · ') : 'Geen score-verschuiving.';
  } catch (e) { uit.textContent = 'Netwerkfout: ' + e.message; }
}
async function mergeArg(id) {
  const uit = document.getElementById(`arg-${id}-uit`); uit.textContent = 'Bezig…';
  try {
    const resp = await fetch(`/api/arguments/${id}/merge`, { method: 'POST' });
    const j = await resp.json();
    if (!resp.ok) { uit.innerHTML = `<span style="color:#e0635f">${esc(j.error)}</span>`; return; }
    uit.innerHTML = `<span style="color:#3ddc84">Gemerged → ${esc(j.status)}${j.self_merged ? ' (zelf-merge: gevlagd)' : ''}</span>`;
    setTimeout(() => { laadVoorstellen(); laadVoorstellenBadge(); }, 1000);
  } catch (e) { uit.textContent = 'Netwerkfout: ' + e.message; }
}
async function afwijsArg(id) {
  // Afwijzen vergt nu een motivatie (Fase B) — zonder feedback kan de auteur niet
  // verbeteren. De reden landt in edit_log en is zichtbaar in de werkbank.
  const motivatie = await vraagTekst('Waarom wijs je dit argument af? De auteur ziet deze reden in de werkbank en kan ermee verbeteren.',
    { titel: 'Argument afwijzen', label: 'Motivatie (verplicht)', okTekst: 'Afwijzen', gevaar: true,
      placeholder: 'bv. feitelijke fout, formulering, of drogreden' });
  if (!motivatie) return;
  const uit = document.getElementById(`arg-${id}-uit`); uit.textContent = 'Bezig…';
  try {
    const resp = await fetch(`/api/arguments/${id}/status`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'verworpen', motivatie }),
    });
    const j = await resp.json();
    if (!resp.ok) { uit.innerHTML = `<span style="color:#e0635f">${esc(j.error)}</span>`; return; }
    uit.innerHTML = '<span style="color:#e0635f">Afgewezen (verworpen — blijft herleidbaar).</span>';
    setTimeout(() => { laadVoorstellen(); laadVoorstellenBadge(); }, 1000);
  } catch (e) { uit.textContent = 'Netwerkfout: ' + e.message; }
}

// ── Adresseerbaarheid: pathname = voorstel-pagina, hash = thread-permalink ──
function huidigeVoorstelId() {
  const m = location.pathname.match(/^\/overleg\/voorstel\/(\d+)\/?$/);
  return m ? parseInt(m[1], 10) : null;
}
function labelVoorThread(param, id) {
  if (indexData) {
    for (const [key, , p] of GROEPEN) {
      if (p !== param) continue;
      const it = (indexData[key] || []).find(x => x.id === id);
      if (it) return it.label;
    }
  }
  return `${param}=${id}`;
}
async function leesHash() {
  const m = location.hash.match(/^#(relation_id|entity_id|role_id|mechanism_id|emergent_effect_id)=(\d+)$/);
  if (!m) return false;
  const param = m[1], id = parseInt(m[2], 10);
  kiesTab('overleg');
  if (!indexData) await laadIndex();
  // ?label= (meegegeven door de viz-titel-link) wint van de index-opzoeking — nodig voor
  // elementen zonder bestaande thread (entiteiten).
  const qlabel = new URLSearchParams(location.search).get('label');
  toonThread(param, id, qlabel || labelVoorThread(param, id));
  return true;
}
// De RfC/voorstel-permalink: het 'dakloze' nieuwe theorie-element dat (nog) geen
// knoop in de graaf heeft, krijgt een eigen adresseerbare pagina.
async function toonVoorstelPagina(vid) {
  toonTabUI('voorstellen');   // alleen de tab-UI; de wachtrij niet laden (dit is één voorstel)
  const m = document.getElementById('vMain');
  m.innerHTML = 'Laden…';
  try {
    const resp = await fetch(`/api/voorstellen/${vid}`);
    if (!resp.ok) {
      const msg = resp.status === 403 ? 'Je hebt geen toegang tot dit voorstel — alleen de indiener of een reviewer kan het bekijken.'
        : resp.status === 401 ? 'Log in om dit voorstel te bekijken.'
        : `Voorstel #${vid} niet gevonden.`;
      m.innerHTML = `<div class="banner">${msg} <a href="/overleg">← naar overleg</a></div>`;
      return;
    }
    const v = await resp.json();
    let h = magReview()
      ? `<a class="graaf-link" href="/overleg" onclick="event.preventDefault();terugNaarVoorstellen()">← Alle voorstellen</a>`
      : `<a class="graaf-link" href="/overleg">← naar overleg</a>`;
    h += rendVoorstel(v);
    if (v.status !== 'open') h += `<div class="banner">Status: <b>${esc(v.status)}</b>` +
      `${v.besloten_at ? ' · besloten ' + esc(v.besloten_at.slice(0, 16)) : ''}. Permanent bewaard en herleidbaar (lineage, M2.6).</div>`;
    m.innerHTML = h;
  } catch (e) { m.innerHTML = `<div class="banner">Netwerkfout: ${esc(e.message)}</div>`; }
}
function terugNaarVoorstellen() {
  history.pushState(null, '', '/overleg');
  if (!magReview()) { kiesTab('overleg'); toonStartkaart(); return; }
  reviewGeladen = false; laadVoorstellen();
}

document.getElementById('oZoek').addEventListener('input', e => tekenLijst(e.target.value));
// Terug naar /overleg zonder hash (browser-terugknop) → startkaart i.p.v. lege detailkolom.
window.addEventListener('hashchange', async () => { if (!(await leesHash())) toonStartkaart(); });
init();
</script>
