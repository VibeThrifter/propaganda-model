<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Accountbeheer — Propagandamodel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/huisstijl.css">
<script src="/static/huisstijl.js"></script>
<style>
:root { --groen: var(--ok); --rood: var(--fout); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 28px 40px; }
h1 { font-size: 19px; margin: 0 0 2px; }
.sub { font-size: 12px; color: var(--text-dim); margin-bottom: 22px; }
h2 { font-size: 13px; margin: 26px 0 10px; color: var(--text-dim);
     text-transform: uppercase; letter-spacing: 0.05em; }
.kaart { padding: 18px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-dim); font-weight: 500; padding: 6px 10px;
     border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase;
     letter-spacing: 0.04em; }
td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
tr.inactief td { opacity: 0.45; }
tr.zelf { background: rgba(108,138,255,0.06); }
.naam { font-weight: 600; }
.meta { font-size: 11px; color: var(--text-muted); }
select, input { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
        background: var(--bg-inzet); color: var(--text); font-size: 12px; }
button { padding: 6px 11px; font-size: 12px; }
.chip { display: inline-block; background: rgba(108,138,255,0.15); border: 1px solid var(--border);
        border-radius: 12px; padding: 2px 8px; margin: 0 4px 4px 0; font-size: 11px; }
.chip b { color: var(--accent); }
.chip .x { cursor: pointer; color: var(--rood); margin-left: 6px; font-weight: 700; }
.frrij { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.badge { font-size: 10px; padding: 1px 6px; border-radius: 5px; background: rgba(0,0,0,0.35);
         color: var(--text-dim); }
.badge.rol-maintainer { color: #ffb86c; } .badge.rol-reviewer { color: var(--accent); }
.fout { color: var(--rood); font-size: 12px; min-height: 1em; margin-top: 8px; }
.ok { color: var(--groen); }
.token { margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.4); border: 1px dashed var(--border);
         border-radius: 7px; font-family: ui-monospace, Menlo, monospace; font-size: 12px;
         word-break: break-all; }
a { color: var(--text-dim); }
.nieuw { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
         align-items: end; }
.nieuw label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
.nieuw input, .nieuw select { width: 100%; }
/* ── Toezicht-paneel (C4) ─────────────────────────────────────────────── */
.tz-tegels { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tegel { background: var(--bg-inzet); border: 1px solid var(--border); border-radius: 9px;
         padding: 13px 14px; display: flex; flex-direction: column; gap: 3px; }
.tegel .t-num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
.tegel .t-lab { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
.tegel .t-sub { font-size: 11px; color: var(--text-muted); }
.t-num.goud { color: var(--goud); } .t-num.groen { color: var(--groen); }
.t-num.rood { color: var(--rood); } .t-num.blauw { color: var(--accent); }
.t-num.grijs { color: var(--text-dim); }
.tz-blok { margin-top: 18px; }
.tz-blok h3 { font-size: 12px; margin: 0 0 8px; color: var(--text-dim);
              text-transform: uppercase; letter-spacing: 0.04em; }
.tz-lijst { list-style: none; margin: 0; padding: 0; }
.tz-lijst li { padding: 8px 0; border-bottom: 1px solid var(--border-zwak); font-size: 12.5px; }
.tz-lijst li:last-child { border-bottom: none; }
.tz-claim { color: var(--text); }
.tz-meta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }
.tz-redenen { color: var(--text-dim); font-size: 11.5px; margin-top: 2px; }
.tz-leeg { color: var(--text-muted); font-size: 12px; font-style: italic; }
.tz-balk { height: 7px; border-radius: 4px; background: var(--bg-inzet); overflow: hidden; margin-top: 5px; }
.tz-balk > span { display: block; height: 100%; background: var(--groen); }
.prog-num { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px;
            background: rgba(224,99,95,0.16); color: var(--rood); margin-left: 6px; }
</style>
</head>
<body>
<header class="topbal" data-actief="beheer"></header>
<div class="wrap" id="wrap">Laden…</div>
<script>
const ROLLEN = ['bijdrager', 'reviewer', 'maintainer'];
let FILTERS = [];
let TOON_INACTIEF = false;
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(url, method, body) {
  const opt = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opt.body = JSON.stringify(body);
  const r = await fetch(url, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || (method + ' ' + url + ' → ' + r.status));
  return d;
}

function fout(msg) { document.getElementById('fout').textContent = msg; }

async function laad() {
  const wrap = document.getElementById('wrap');
  let me;
  try { me = await (await fetch('/api/me')).json(); } catch { me = null; }
  if (!me || me.error) { window.location.href = '/login'; return; }
  if (me.role !== 'maintainer') {
    wrap.innerHTML = `<h1>Accountbeheer</h1>
      <p style="color:var(--rood)">Geen toegang — deze pagina is voor maintainers.
      Je bent <b>${esc(me.role)}</b>.</p>
      <p><a href="/account">← naar je account</a></p>`;
    return;
  }
  wrap.innerHTML = `
    <h1>Accountbeheer</h1>
    <div class="sub">Rollen, filterrollen en accounts beheren — ingelogd als
      <b>${esc(me.username)}</b> (maintainer).</div>
    <div class="fout" id="fout"></div>

    <div class="kaart" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-left:3px solid var(--goud,#c99700)">
      <div><b>Openstaande owner-acties</b><div class="sub" style="margin:0">De hand-offs uit de monetisatie-bouw
        (deploy, agents/timers aanzetten, auto-merge inschakelen, ads activeren, feed-key minten…).</div></div>
      <a class="knop primair" href="/beheer/acties">Bekijk owner-acties →</a>
    </div>

    <h2>Toezicht
      <button type="button" class="uitleg" aria-label="Uitleg toezicht"
        data-uitleg="Privé kalibratie-overzicht (C4): jij stuurt op de meta-laag — steekproef van auto-merges, gevlagde twijfel-/hoog-inzet-items, verlopen voorspellingen + Brier, validatiefouten en archiveer-voortgang — i.p.v. de doorvoer-merge-knop te bedienen.">ⓘ</button></h2>
    <div class="kaart"><div id="toezicht">Laden…</div></div>

    <h2>Nieuwe gebruiker</h2>
    <div class="kaart">
      <form class="nieuw" id="nieuwForm">
        <div><label>Gebruikersnaam</label><input id="nUser" placeholder="kebab-case" autocomplete="off"></div>
        <div><label>Soort</label>
          <select id="nKind">
            <option value="mens">mens</option>
            <option value="agent">agent</option>
          </select></div>
        <div><label>Rol</label>
          <select id="nRol">${ROLLEN.map(r => `<option value="${r}">${r}</option>`).join('')}</select></div>
        <div id="nMensVeld"><label>Initieel wachtwoord</label>
          <input id="nPw" type="password" placeholder="min. 8 tekens" autocomplete="new-password"></div>
        <div id="nAgentVeld" style="display:none"><label>Provenance (model + versie)</label>
          <input id="nProv" placeholder="bv. claude-opus-4-8"></div>
        <div><button class="primair" type="submit">Aanmaken</button></div>
      </form>
      <div id="nResultaat"></div>
    </div>

    <h2>Accounts</h2>
    <div class="kaart"><div id="tabel">Laden…</div></div>`;

  document.getElementById('nKind').addEventListener('change', e => {
    const agent = e.target.value === 'agent';
    document.getElementById('nMensVeld').style.display = agent ? 'none' : '';
    document.getElementById('nAgentVeld').style.display = agent ? '' : 'none';
  });
  document.getElementById('nieuwForm').addEventListener('submit', maakNieuw);
  laadToezicht();   // los; blokkeert het accountbeheer niet
  await tekenTabel();
}

// ── Toezicht-paneel (C4) ──────────────────────────────────────────────────
// Haalt het dunne samenvattingsendpoint GET /api/toezicht op en toont de zes
// meta-signalen + een steekproef van recente auto-merges. Het endpoint kan leeg
// zijn/ontbreken zolang de auto-merge-service (C2) nog niet draait → nette lege staat.
function tzTegel(num, label, kleur, sub) {
  return `<div class="tegel"><div class="t-num ${kleur}">${num}</div>` +
    `<div class="t-lab">${esc(label)}</div>` +
    (sub ? `<div class="t-sub">${esc(sub)}</div>` : '') + `</div>`;
}
async function laadToezicht() {
  const el = document.getElementById('toezicht');
  if (!el) return;
  let d;
  try {
    const r = await fetch('/api/toezicht');
    if (r.status === 404) {
      el.innerHTML = `<div class="tz-leeg">Toezicht-service (C4) nog niet actief — geen /api/toezicht.
        Zodra de auto-merge-service draait verschijnen hier de kalibratie-signalen.</div>`;
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
  } catch (e) {
    el.innerHTML = `<div class="tz-leeg">Kon het toezichtoverzicht niet laden (${esc(e.message)}).</div>`;
    return;
  }
  if (!d || typeof d !== 'object' || !Object.keys(d).length) {
    el.innerHTML = `<div class="tz-leeg">Nog geen toezichtdata beschikbaar.</div>`;
    return;
  }
  const am = d.auto_merge || {};
  const vs = d.voorspellingen || {};
  const val = d.validatie || {};
  const verlopen = vs.open_verlopen || [];
  const geblokkeerd = am.geblokkeerd_items || [];   // optioneel: lijst persoons-claims
  const runs = d.agent_runs || null;                 // optioneel: vastgelopen/lege runs

  // Archiefdekking kan een fractie (0–1), percentage of object zijn — defensief.
  let dekPct = null, dekSub = '';
  const ad = d.archief_dekking;
  if (ad != null) {
    if (typeof ad === 'object') {
      if (ad.pct != null) dekPct = ad.pct > 1 ? ad.pct : ad.pct * 100;
      else if (ad.totaal) { dekPct = 100 * (ad.gearchiveerd || 0) / ad.totaal; dekSub = `${ad.gearchiveerd || 0}/${ad.totaal}`; }
    } else { dekPct = ad > 1 ? ad : ad * 100; }
  }
  const nVal = num => (num == null ? 0 : num);
  const foutN = nVal(val.fouten);

  // (1) auto-gemerged vs geparkeerd sinds gisteren · (2) hoog-inzet-blokkades ·
  // (3) vastgelopen/lege runs · (4) verlopen voorspellingen + Brier ·
  // (5) validatiefouten boven baseline · (6) archiveer-voortgang.
  const tegels = [
    tzTegel(nVal(am.gemerged_24u), 'auto-gemerged (24u)', 'blauw'),
    tzTegel(nVal(am.geparkeerd), 'geparkeerd — twijfel', 'goud', 'sinds gisteren'),
    tzTegel(nVal(am.geblokkeerd), 'geblokkeerd — hoog inzet', 'goud', 'wacht op akkoord'),
    tzTegel(verlopen.length, 'voorspellingen verlopen', verlopen.length ? 'goud' : 'groen',
            vs.brier != null ? `Brier ${Number(vs.brier).toFixed(3)}` : 'nog geen Brier'),
    tzTegel(foutN, 'validatiefouten > baseline', foutN ? 'rood' : 'groen',
            [val.waarschuwingen != null ? val.waarschuwingen + ' waarsch.' : null,
             val.info != null ? val.info + ' info' : null].filter(Boolean).join(' · ')),
    tzTegel(dekPct != null ? Math.round(dekPct) + '%' : '—', 'archiefdekking', 'blauw', dekSub || null),
  ];
  if (runs != null) {
    const rn = typeof runs === 'number' ? runs : (runs.vastgelopen != null ? runs.vastgelopen : (runs.length || 0));
    tegels.push(tzTegel(rn, 'vastgelopen/lege agent-runs', rn ? 'rood' : 'groen'));
  }

  let h = `<div class="tz-tegels">${tegels.join('')}</div>`;
  if (dekPct != null) h += `<div class="tz-balk"><span style="width:${Math.max(0, Math.min(100, dekPct))}%"></span></div>`;

  // Steekproef van recent auto-gemergede items — kalibreer de auto-merge-kwaliteit
  // zonder alles te lezen.
  const steek = d.steekproef || [];
  h += `<div class="tz-blok"><h3>Steekproef auto-merges
    <button type="button" class="uitleg" aria-label="Uitleg steekproef"
      data-uitleg="Willekeurige greep uit recent auto-gemergede argumenten (merged_by='merge-service'). Lees een paar om de auto-merge-lat te ijken; keur er een af via de admin-CLI om 'm terug te sturen ter herkeuring.">ⓘ</button></h3>`;
  h += steek.length
    ? `<ul class="tz-lijst">${steek.map(s =>
        `<li><div class="tz-claim">${esc(s.claim || '(zonder claim)')}</div>
         <div class="tz-meta">${s.arg_id != null ? '#' + esc(s.arg_id) : ''}${s.target ? ' · ' + esc(s.target) : ''}${s.merged_at ? ' · ' + esc(s.merged_at) : ''}</div></li>`).join('')}</ul>`
    : `<div class="tz-leeg">Nog geen auto-merges om te steekproeven.</div>`;
  h += `</div>`;

  // Hoog-inzet-blokkades die op akkoord wachten — de énige items die de eigenaar nog
  // handmatig beoordeelt (persoons-claims). De volledige beoordeling gebeurt op /overleg.
  if (geblokkeerd.length) {
    h += `<div class="tz-blok"><h3>Hoog-inzet — wacht op akkoord</h3><ul class="tz-lijst">` +
      geblokkeerd.map(g =>
        `<li><div class="tz-claim">${esc(g.claim || '(zonder claim)')}</div>
         <div class="tz-redenen">${(g.redenen || []).map(esc).join(' · ')}</div>
         <div class="tz-meta">${g.arg_id != null ? '#' + esc(g.arg_id) : ''} · beoordeel op <a href="/overleg">/overleg</a></div></li>`).join('') +
      `</ul></div>`;
  }

  // Verlopen open voorspellingen — resolveer ze zodat de Brier-reeks loopt (A4).
  if (verlopen.length) {
    h += `<div class="tz-blok"><h3>Voorspellingen te resolven</h3><ul class="tz-lijst">` +
      verlopen.map(v =>
        `<li><div class="tz-claim">${esc(v.claim || v.titel || '(voorspelling)')}</div>
         <div class="tz-meta">${v.id != null ? '#' + esc(v.id) : ''}${v.deadline ? ' · deadline ' + esc(v.deadline) : ''}${v.kans != null ? ' · kans ' + esc(v.kans) : ''}</div></li>`).join('') +
      `</ul><div class="t-sub" style="margin-top:6px">Resolveer via <code>PATCH /api/predictions/&lt;id&gt;/uitkomst</code> (reviewer+, berekent Brier).</div></div>`;
  }
  el.innerHTML = h;
}

async function tekenTabel() {
  fout('');
  let data;
  try { data = await api('/api/users', 'GET'); } catch (e) { fout(e.message); return; }
  FILTERS = data.filters || [];
  const inactiefN = data.users.filter(u => !u.active).length;
  const zichtbaar = data.users.filter(u => u.active || TOON_INACTIEF);
  const rijen = zichtbaar.map(u => {
    const frChips = Object.entries(u.filterrollen).map(([f, r]) =>
      `<span class="chip"><b>${esc(f)}</b>=${esc(r)}<span class="x"
         onclick="zetFilterrol(${u.id}, '${esc(f)}', '')" title="intrekken">✕</span></span>`).join('') || '<span class="meta">—</span>';
    const rolSel = `<select onchange="zetRol(${u.id}, this.value)" ${u.is_zelf ? 'disabled' : ''}>
      ${ROLLEN.map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}</select>`;
    const actBtn = u.is_zelf
      ? `<span class="meta">jij</span>`
      : `<button onclick="zetActief(${u.id}, ${u.active ? 'false' : 'true'})">${u.active ? 'deactiveren' : 'activeren'}</button>`;
    const status = [
      u.kind === 'mens' ? (u.heeft_wachtwoord ? 'wachtwoord' : 'géén wachtwoord') : null,
      u.heeft_token ? 'token' : null,
    ].filter(Boolean).join(' · ') || '—';
    return `<tr class="${u.active ? '' : 'inactief'} ${u.is_zelf ? 'zelf' : ''}">
      <td><span class="naam">${esc(u.username)}</span>
          <div class="meta">${esc(u.kind)}${u.provenance ? ' · ' + esc(u.provenance) : ''}</div>
          <div class="meta">laatste login: ${esc(u.last_login_at || '—')}</div></td>
      <td>${rolSel}</td>
      <td>${actBtn}<div class="meta">${u.active ? 'actief' : 'inactief'}</div></td>
      <td>${frChips}
        <div class="frrij">
          <select id="fr-f-${u.id}">${FILTERS.map(f => `<option>${f}</option>`).join('')}</select>
          <select id="fr-r-${u.id}"><option value="reviewer">reviewer</option><option value="maintainer">maintainer</option></select>
          <button onclick="zetFilterrolUit(${u.id})">+ toekennen</button>
        </div></td>
      <td><div class="meta">${esc(status)}</div></td>
    </tr>`;
  }).join('');
  document.getElementById('tabel').innerHTML = `
    <table>
      <tr><th>Gebruiker</th><th>Globale rol</th><th>Actief</th><th>Filterrollen</th><th>Auth</th></tr>
      ${rijen}
    </table>
    <div class="meta" style="margin-top:10px">
      ${inactiefN ? `<a href="#" onclick="event.preventDefault(); TOON_INACTIEF=!TOON_INACTIEF; tekenTabel()">${TOON_INACTIEF ? '− verberg' : '+ toon'} ${inactiefN} inactieve account(s)</a> · ` : ''}Effectieve rol binnen een filter =
      max(globale rol, filterrol). Je eigen rol/status wijzig je hier niet (lockout-risico).</div>`;
}

async function zetRol(uid, rol) {
  try { await api('/api/users/' + uid, 'PATCH', { role: rol }); await tekenTabel(); }
  catch (e) { await tekenTabel(); fout(e.message); }  // re-render eerst (dropdown terug), dán melden
}
async function zetActief(uid, actief) {
  try { await api('/api/users/' + uid, 'PATCH', { active: actief }); await tekenTabel(); }
  catch (e) { fout(e.message); }
}
async function zetFilterrol(uid, filter, rol) {
  try { await api('/api/users/' + uid + '/filterrol', 'POST', { filter, rol }); await tekenTabel(); }
  catch (e) { fout(e.message); }
}
function zetFilterrolUit(uid) {
  const f = document.getElementById('fr-f-' + uid).value;
  const r = document.getElementById('fr-r-' + uid).value;
  zetFilterrol(uid, f, r);
}

async function maakNieuw(e) {
  e.preventDefault();
  const res = document.getElementById('nResultaat');
  res.innerHTML = '';
  const kind = document.getElementById('nKind').value;
  const body = {
    username: document.getElementById('nUser').value.trim(),
    kind, role: document.getElementById('nRol').value,
  };
  if (kind === 'agent') body.provenance = document.getElementById('nProv').value.trim();
  else body.wachtwoord = document.getElementById('nPw').value;
  try {
    const d = await api('/api/users', 'POST', body);
    document.getElementById('nieuwForm').reset();
    document.getElementById('nMensVeld').style.display = '';
    document.getElementById('nAgentVeld').style.display = 'none';
    res.innerHTML = `<div class="ok" style="margin-top:10px">Account <b>${esc(d.username)}</b> aangemaakt (${esc(d.role)}).</div>`
      + (d.token ? `<div class="token">${esc(d.token)}</div>
          <div class="meta">${esc(d.let_op || '')} Gebruik: <code>Authorization: Bearer &lt;token&gt;</code></div>` : '');
    await tekenTabel();
  } catch (err) { res.innerHTML = `<div class="fout">${esc(err.message)}</div>`; }
}

laad();
</script>
</body>
</html>
