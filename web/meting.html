<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Eigen metingen — Propagandamodel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Eigen metingen: vooraf vastgelegde tellingen van wie in welk medium aan het woord komt, met welk standpunt, volgens de journalistieke codes.">
<link rel="stylesheet" href="/static/huisstijl.css">
<script src="/static/huisstijl.js"></script>
<script src="/static/shared_vocab.js"></script>
<style>
main { max-width: 1120px; margin: 0 auto; padding: 20px 22px 40px; }
h1 { font-size: 22px; letter-spacing: -0.02em; margin: 2px 0 6px; }
.lead { font-size: 13.5px; color: var(--text-dim); line-height: 1.6; max-width: 78ch; margin: 4px 0 14px; }
.kop .vraag { font-size: 14px; color: var(--text); margin: 4px 0 10px; max-width: 80ch; line-height: 1.55; }
.kop .acties { margin-top: 10px; }
.hash { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text-muted); }
.statusbadge.m-opzet { background: color-mix(in srgb, var(--goud) 20%, transparent); color: var(--goud); }
.statusbadge.m-vastgelegd { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
.statusbadge.m-afgerond { background: rgba(61,220,132,0.14); color: var(--ok); }
.statusbadge { font-size: 11px; padding: 2px 9px; }
.tabs { position: sticky; top: var(--topbal-h); z-index: 5; background: var(--bg);
  padding: 10px 0 11px; margin: 14px 0 14px; border-bottom: 1px solid var(--border); }
section[data-pane] { display: none; }
section[data-pane].actief { display: block; }
.hint { font-size: 12.5px; color: var(--text-dim); margin: 0 0 12px; max-width: 78ch; line-height: 1.55; }
.hint b { color: var(--text); font-weight: 600; }
/* Checklist */
.punten { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.punt { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg-card); }
.punt.ok { border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.punt.open { border-color: color-mix(in srgb, var(--goud) 40%, transparent); }
.punt-kop { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.punt-icoon { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center;
  justify-content: center; font-size: 12px; flex-shrink: 0; }
.punt.ok .punt-icoon { background: rgba(61,220,132,0.18); color: var(--ok); }
.punt.open .punt-icoon { background: color-mix(in srgb, var(--goud) 22%, transparent); color: var(--goud); }
.punt.nvt .punt-icoon { background: rgba(255,255,255,0.08); color: var(--text-muted); }
.punt-uitleg { font-size: 12px; color: var(--text-dim); margin: 6px 0 0; line-height: 1.5; }
.punt ul { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: var(--text-dim); }
.punt li { margin: 2px 0; }
.punt .waarsch { color: var(--warn); }
/* Tabellen */
table.uitslag { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0 14px; }
table.uitslag th, table.uitslag td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-zwak); vertical-align: top; }
table.uitslag th { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
table.uitslag td.getal { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.uitslag tr.totaal td { color: var(--text-dim); border-top: 1px solid var(--border); }
.tabel-wrap { overflow-x: auto; }
.balk { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-left: 6px; opacity: 0.7; }
.regels { list-style: none; padding: 0; margin: 6px 0; }
.regels li { font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 6px 8px; border: 1px solid var(--border-zwak);
  border-radius: 7px; margin: 5px 0; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.regels li span { flex: 1; }
.regels li button { font-family: inherit; font-size: 11px; padding: 3px 8px; flex-shrink: 0; }
/* Formulieren */
.raster { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.raster .vol { grid-column: 1 / -1; }
@media (max-width: 700px) { .raster { grid-template-columns: 1fr; } .punten { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip-x { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 4px 3px 10px;
  border: 1px solid var(--border); border-radius: 11px; color: var(--text); }
.chip-x button { padding: 0 6px; border: none; background: none; color: var(--text-muted); font-size: 14px; line-height: 1; }
.kiezer { position: relative; }
.kiezer-lijst { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: 2px; max-height: 260px; overflow-y: auto;
  background: #16161f; border: 1px solid var(--border-light); border-radius: 8px; box-shadow: var(--shadow); }
.kiezer-lijst:empty { display: none; }
.kiezer-item { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 0;
  padding: 7px 10px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; }
.kiezer-item:hover, .kiezer-item:focus-visible { background: rgba(255,255,255,.07); color: var(--text); }
.kiezer-item small { color: var(--text-muted); margin-left: 6px; }
.blok { border: 1px solid var(--border-zwak); border-radius: 9px; padding: 10px 12px; margin: 8px 0; background: rgba(0,0,0,0.15); }
.blok-kop { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.fouten { margin: 8px 0 0; padding-left: 18px; font-size: 12px; color: var(--fout); }
.knoppen { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
/* Waarnemingen */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.filters select, .filters input { width: auto; min-width: 140px; }
.wn { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 0; background: var(--bg-card); }
.wn-kop { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); }
.wn-kop b { color: var(--text); font-weight: 600; }
.wn blockquote, blockquote.citaat-blok { margin: 6px 0; padding: 4px 0 4px 10px; border-left: 2px solid var(--border-light); font-size: 13px; color: var(--text); }
.wn .codes { font-size: 12px; color: var(--text-dim); }
.wn .codes b { color: var(--text); font-weight: 600; }
.tag.ok { background: rgba(61,220,132,0.14); color: var(--ok); }
.tag.fout { background: rgba(224,99,95,0.16); color: var(--fout); }
.tag.open { background: color-mix(in srgb, var(--goud) 18%, transparent); color: var(--goud); }
.commando { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
.commando code { padding: 5px 8px; font-size: 12px; }
/* Controle */
.vergelijk { font-size: 12.5px; margin: 8px 0; }
.vergelijk .gelijk { color: var(--ok); }
.vergelijk .anders { color: var(--warn); }
.klassen { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; margin: 8px 0; }
.klasse { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px;
  font-size: 12.5px; cursor: pointer; background: var(--bg-inzet); }
.klasse input { width: auto; margin-top: 3px; }
.klasse.niet { opacity: 0.45; cursor: not-allowed; }
.klasse .gewicht { font-variant-numeric: tabular-nums; color: var(--goud); font-weight: 600; }
.klasse small { display: block; color: var(--text-muted); font-size: 11px; }
.klasse:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  background: color-mix(in srgb, var(--accent) 10%, transparent); }
.lijst-kaart h3 a { color: var(--text); }
.toets-ok { color: var(--ok); font-size: 12px; }
.toets-fout { color: var(--fout); font-size: 12px; }
</style>
</head>
<body>
<header class="topbal" data-actief="metingen"></header>
<main id="main"><div class="leeg">Laden…</div></main>

<script>
// Eigen metingen (eigenaarsbesluit 2026-10-16). Eén pagina, twee standen: /metingen (lijst) en
// /meting/<id> (één meting). Alle data via /api/metingen…; zie metingen.py en server.py.
const RECTIFICATIE = '/tip?betreft=meting:';
const esc = hsEsc;
const M_ID = (() => { const x = location.pathname.match(/^\/meting\/(\d+)/); return x ? +x[1] : null; })();
const ONDERWERP_LABEL = { nl_systeem: 'Nederlands systeem', algemeen: 'Algemeen (landneutraal)',
  buitenlands: 'Buitenlands', onbepaald: 'Onbepaald' };
const STATUS_UITLEG = {
  opzet: 'De opzet is nog te bewerken. Leg haar vast vóór de eerste waarneming.',
  vastgelegd: 'De opzet ligt vast. Voer waarnemingen in, laat ze blind controleren en vraag wederhoor.',
  afgerond: 'De dataset en de samenvatting liggen vast. De meting is publiek en kan als bewijs dienen.',
};
let ME = null, M = null, GRAAF = null, GRAAF_LAAD = null;
let TAB = (location.hash || '').replace('#', '') || 'overzicht';
let OPZET = null;                 // bewerkbare kopie van de opzet (status 'opzet')
let INVOER = {};                  // waarden van het invoerformulier (blijven staan na opslaan)
let BEWERK_ID = null;             // waarneming die in het formulier bewerkt wordt
let FILTER = { groep: '', medium: '', citaat: '', controle: '', zoek: '' };
let CONTROLE = null, CONTROLE_UITSLAG = null;
let BEWIJS = { soort: 'relation', doel: null, regel: null, claim: '', stance: 'supporting', invloed: false };
let CLAIM_TIMER = null;

async function api(method, pad, body) {
  const opties = { method, headers: {} };
  if (body !== undefined) { opties.headers['Content-Type'] = 'application/json'; opties.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(pad, opties); } catch (e) { return { ok: false, status: 0, j: { error: 'Netwerkfout: ' + e.message } }; }
  let j = {};
  try { j = await r.json(); } catch (e) { j = {}; }
  return { ok: r.ok, status: r.status, j };
}
function foutLijst(j) {
  const regels = (j && (j.fouten || j.open)) || [];
  return `${esc((j && j.error) || 'Er ging iets mis')}${regels.length ? '<ul class="fouten">' + regels.map(f => `<li>${esc(f)}</li>`).join('') + '</ul>' : ''}`;
}
function toonFout(el, j) { if (el) el.innerHTML = `<div class="fout-tekst">${foutLijst(j)}</div>`; else melding((j && j.error) || 'Er ging iets mis', 'fout'); }
function tijd(s) {
  if (!s) return '';
  const d = new Date(String(s).replace(' ', 'T') + (String(s).length <= 19 ? 'Z' : ''));
  if (isNaN(d)) return esc(s);
  return d.toLocaleString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function statusBadge(s) { return `<span class="statusbadge m-${esc(s)}">${esc(s)}</span>`; }
function uitleg(tekst) { return `<button type="button" class="uitleg" data-uitleg="${esc(tekst)}" aria-label="Uitleg">ⓘ</button>`; }
function naam(id) { return (M && M.namen && M.namen[String(id)]) || (GRAAF && GRAAF.ent.get(id) && GRAAF.ent.get(id).name) || `knoop #${id}`; }
function getal(x) { return x == null ? '–' : String(x).replace('.', ','); }
function relLabel(t) { return (typeof RELATION_LABELS !== 'undefined' && RELATION_LABELS[t]) || weergaveNaam(t); }
function kopieer(tekst) {
  navigator.clipboard.writeText(tekst).then(() => melding('Gekopieerd', 'ok', 1800), () => melding('Kopiëren lukte niet', 'fout'));
}
function commando(tekst) {
  return `<div class="commando"><code>${esc(tekst)}</code><button type="button" data-kopieer="${esc(tekst)}">Kopieer</button></div>`;
}
// Knoppen met tekst uit de data: via data-attributen, nooit in een inline handler
document.addEventListener('click', e => {
  const el = e.target instanceof Element ? e.target.closest('[data-kopieer],[data-als-bewijs],[data-menu-waarneming]') : null;
  if (!el) return;
  if (el.dataset.kopieer !== undefined) kopieer(el.dataset.kopieer);
  else if (el.dataset.alsBewijs !== undefined) regelAlsBewijs(el.dataset.alsBewijs);
  else {
    const id = +el.dataset.menuWaarneming;
    hsMenu(el, [{ label: 'Bewerk', onClick: () => bewerkWaarneming(id) }, '---',
                { label: 'Verwijder', gevaar: true, onClick: () => verwijderWaarneming(id) }]);
  }
});

// ── Knopen zoeken (de bestaande graafdata, één keer geladen) ──────────────
function norm(s) { return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
async function laadGraaf() {
  if (GRAAF) return GRAAF;
  if (!GRAAF_LAAD) {
    GRAAF_LAAD = fetch('/api/graph_data/viz').then(r => r.json()).then(d => {
      const ent = new Map((d.entities || []).map(e => [e.id, e]));
      GRAAF = { ent, entities: d.entities || [], relations: d.relations || [], mechanisms: d.mechanisms || [] };
      return GRAAF;
    }).catch(() => { GRAAF_LAAD = null; return null; });
  }
  return GRAAF_LAAD;
}
function zoek(soort, q) {
  if (!GRAAF) return [];
  const n = norm(q).trim();
  if (n.length < 2) return [];
  const score = s => { const x = norm(s); const i = x.indexOf(n); return i < 0 ? -1 : (i === 0 ? 0 : 1) * 1000 + x.length; };
  let uit = [];
  if (soort === 'entity') {
    uit = GRAAF.entities.map(e => ({ id: e.id, label: e.name, sub: weergaveNaam(e.type), s: score(e.name) }));
  } else if (soort === 'relation') {
    uit = GRAAF.relations.map(r => {
      const a = GRAAF.ent.get(r.source_id), b = GRAAF.ent.get(r.target_id);
      const label = `${a ? a.name : '#' + r.source_id} → ${b ? b.name : '#' + r.target_id}`;
      const s = Math.min(...[score(a ? a.name : ''), score(b ? b.name : '')].map(x => x < 0 ? 1e9 : x));
      return { id: r.id, label, sub: relLabel(r.relation_type) + (r.status && r.status !== 'goedgekeurd' ? ' · ' + r.status : ''), s: s >= 1e9 ? -1 : s };
    });
  } else {
    uit = GRAAF.mechanisms.map(m => ({ id: m.id, label: weergaveNaam(m.name), sub: weergaveNaam(m.filter), s: Math.max(score(m.name), score(weergaveNaam(m.name))) }));
  }
  return uit.filter(x => x.s >= 0).sort((a, b) => a.s - b.s).slice(0, 14);
}
// kiezer: invoerveld + uitklaplijst; onKies(item) bij een keuze
function kiezer(id, placeholder) {
  return `<div class="kiezer"><input class="veld" type="text" id="${id}" placeholder="${esc(placeholder)}" autocomplete="off"><div class="kiezer-lijst" id="${id}-lijst"></div></div>`;
}
const KIEZERS = {};
function koppelKiezer(id, soort, onKies) {
  const inp = document.getElementById(id), lijst = document.getElementById(id + '-lijst');
  if (!inp || !lijst) return;
  KIEZERS[id] = { soort: typeof soort === 'function' ? soort : () => soort, onKies };
  inp.addEventListener('focus', () => laadGraaf());
  inp.addEventListener('input', async () => {
    await laadGraaf();
    if (!GRAAF) { lijst.innerHTML = '<div class="kiezer-item">Graafdata niet te laden</div>'; return; }
    const res = zoek(KIEZERS[id].soort(), inp.value);
    lijst.innerHTML = res.map((x, i) => `<button type="button" class="kiezer-item" data-i="${i}">${esc(x.label)}<small>${esc(x.sub || '')} · #${x.id}</small></button>`).join('');
    lijst.querySelectorAll('.kiezer-item').forEach(b => b.addEventListener('click', () => {
      const item = res[+b.dataset.i];
      lijst.innerHTML = ''; inp.value = '';
      onKies(item);
    }));
  });
  const sluitAlsWeg = () => setTimeout(() => {
    if (document.activeElement !== inp && !lijst.contains(document.activeElement)) lijst.innerHTML = '';
  }, 150);
  inp.addEventListener('blur', sluitAlsWeg);
  lijst.addEventListener('focusout', sluitAlsWeg);
  lijst.addEventListener('mousedown', e => e.preventDefault());   // een klik op een treffer laat de focus staan
  inp.addEventListener('keydown', e => {
    const eerste = lijst.querySelector('.kiezer-item');
    if (e.key === 'ArrowDown' && eerste) { e.preventDefault(); eerste.focus(); }
    else if (e.key === 'Enter' && eerste) { e.preventDefault(); eerste.click(); }
    else if (e.key === 'Escape') lijst.innerHTML = '';
  });
  lijst.addEventListener('keydown', e => {
    const items = [...lijst.querySelectorAll('.kiezer-item')], i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? items[i - 1] : inp).focus(); }
    else if (e.key === 'Escape') { lijst.innerHTML = ''; inp.focus(); }
  });
}

// ── Lijst (/metingen) ──────────────────────────────────────────────────────
async function laadLijst() {
  const { ok, j } = await api('GET', '/api/metingen');
  const main = document.getElementById('main');
  const lijst = ok ? j.metingen : [];
  main.innerHTML = `
    <h1>Eigen metingen</h1>
    <p class="lead">Een eigen meting is een telling die je vooraf vastlegt: welke organisatie of deskundige
    komt in welk medium aan het woord, over welk onderwerp, met welk standpunt, en wordt de financiering
    vermeld. De opzet ligt vast vóór de eerste waarneming, elk citaat wordt op zijn url teruggezocht, een
    ander codeert een steekproef blind opnieuw, en de betrokken partijen krijgen wederhoor. Een afgeronde
    meting wordt een bron waarop een argument in het model kan steunen; hoe zwaar die weegt, bepaalt de
    eigenaar. ${uitleg('De journalistieke codes (Leidraad van de Raad voor de Journalistiek, NVJ-code) zijn harde voorwaarden: methode vooraf, volledigheid, juistheid en herleidbaarheid, verificatie door een ander, hoor en wederhoor, feit en mening gescheiden, privacy, en correctie. Afronden eist de eerste vier, een meting als bewijs gebruiken alle acht.')}</p>
    ${ME ? `<div class="form" style="max-width:760px">
      <h4>Nieuwe meting</h4>
      <label for="nTitel">Titel</label><input id="nTitel" type="text" maxlength="200" placeholder="bv. Denktanks over defensie-uitgaven bij NOS en RTL">
      <label for="nVraag">Onderzoeksvraag</label><textarea id="nVraag" maxlength="2000" placeholder="Welke vraag beantwoordt de telling?"></textarea>
      <div class="knoppen"><button class="prim" type="button" onclick="nieuweMeting()">Opzet beginnen</button><span id="nFout"></span></div>
    </div>` : `<div class="banner">Je ziet de afgeronde metingen. <a href="/login?next=/metingen">Log in</a> om zelf een meting te beginnen.</div>`}
    <h2 class="sectie">${ME ? 'Alle metingen' : 'Afgeronde metingen'} (${lijst.length})</h2>
    ${lijst.length ? lijst.map(x => `<div class="kaart lijst-kaart">
        <h3><a href="${esc(x.url)}">${esc(x.titel)}</a> ${statusBadge(x.status)}</h3>
        <div class="hint" style="margin:2px 0 6px">${esc(x.vraag)}</div>
        <div class="meta"><span>#${x.id}</span><span>${x.n_waarnemingen} waarneming(en)</span><span>door ${esc(x.contributed_by)}</span>
          <span>${x.afgerond_at ? 'afgerond ' + tijd(x.afgerond_at) : x.vastgelegd_at ? 'vastgelegd ' + tijd(x.vastgelegd_at) : 'begonnen ' + tijd(x.created_at)}</span></div>
      </div>`).join('') : `<div class="leeg">${ME ? 'Nog geen metingen.' : 'Nog geen afgeronde metingen.'}</div>`}`;
}
async function nieuweMeting() {
  const titel = document.getElementById('nTitel').value.trim(), vraag = document.getElementById('nVraag').value.trim();
  const { ok, j } = await api('POST', '/api/metingen', { titel, vraag, opzet: {} });
  if (!ok) { toonFout(document.getElementById('nFout'), j); return; }
  location.href = j.url + '#opzet';
}

// ── Eén meting (/meting/<id>) ─────────────────────────────────────────────
async function herlaad() {
  const { ok, status, j } = await api('GET', `/api/metingen/${M_ID}`);
  const main = document.getElementById('main');
  if (!ok) {
    main.innerHTML = `<h1>Meting #${M_ID}</h1><div class="banner waarschuwing">${status === 404 ? 'Deze meting bestaat niet.' : esc(j.error || 'Niet te laden')}
      ${status === 401 ? ` <a href="/login?next=/meting/${M_ID}">Log in</a>.` : ''}</div><p><a href="/metingen">← Alle metingen</a></p>`;
    return;
  }
  M = j;
  document.title = `${M.titel} — eigen meting — Propagandamodel`;
  if (M.status === 'opzet' && (!OPZET || OPZET._id !== M.id)) { OPZET = JSON.parse(JSON.stringify(M.opzet || {})); OPZET._id = M.id; }
  render();
}

function render() {
  const main = document.getElementById('main');
  const tabs = [['overzicht', 'Overzicht'], ['opzet', 'Opzet'], ['waarnemingen', `Waarnemingen <span class="telb">${M.waarnemingen.length}</span>`],
    ['controle', `Controle <span class="${M.gecontroleerd >= M.nodig_controles ? 'telb' : 'badge'}">${M.gecontroleerd}/${M.nodig_controles}</span>`],
    ['wederhoor', `Wederhoor <span class="${M.wederhoor_eisen.every(e => e.voldaan) ? 'telb' : 'badge'}">${M.wederhoor.length}</span>`],
    ['bewijs', `Bewijs <span class="telb">${M.argumenten.length}</span>`]];
  if (!tabs.some(t => t[0] === TAB)) TAB = 'overzicht';
  main.innerHTML = `
    <p style="margin:0 0 6px"><a href="/metingen">← Alle metingen</a></p>

function kiesTab(k) {

function naRender() {

// ── Overzicht: checklist, uitslag, overeenstemming ─────────────────────────
function paneelOverzicht() {
  const punten = M.code_check.map(p => {
    const klasse = p.ok === true ? 'ok' : p.ok === false ? 'open' : 'nvt';
    const icoon = p.ok === true ? '✓' : p.ok === false ? '○' : '–';
    return `<div class="punt ${klasse}">
      <div class="punt-kop"><span class="punt-icoon">${icoon}</span>${esc(p.sleutel)}. ${esc(p.titel)} ${uitleg(p.regel)}</div>
      <div class="punt-uitleg">${esc(p.uitleg)}</div>
      ${p.open && p.open.length ? `<ul>${p.open.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${p.waarschuwingen && p.waarschuwingen.length ? `<ul>${p.waarschuwingen.map(x => `<li class="waarsch">⚠ ${esc(x)}</li>`).join('')}</ul>` : ''}
    </div>`;
  }).join('');
  return `
    <h2 class="sectie">Journalistieke codes ${uitleg('Afronden eist a–d. Een meting als bewijs gebruiken eist a–h; punt f toetst de claim van dat argument.')}</h2>
    <div class="punten">${punten}</div>
    ${uitslagHtml()}
    ${overeenstemmingHtml()}
    ${meldingenHtml()}
    ${M.mag.beheren && M.status === 'vastgelegd' ? `<h2 class="sectie">Citaten nu laten terugzoeken</h2>
      <p class="hint">De uurronde zoekt elk citaat op zijn url (metingcheck, stap 2c). Wil je niet wachten, draai dan:</p>${commando(M.commando_check)}` : ''}`;
}
function uitslagHtml() {
  const s = M.samenvatting;
  if (!s) {
    return `<h2 class="sectie">Uitslag</h2><div class="leeg">${M.status === 'afgerond' ? 'Geen samenvatting.' :
      'De uitslag ziet alleen de maker zolang de meting niet afgerond is (de controle blijft blind).'}</div>`;
  }
  const vragen = (M.opzet.vragen || []);
  const blokken = s.groepen.concat(s.totaal ? [Object.assign({}, s.totaal, { totaal: true })] : []);
  const perVraag = vragen.map(v => {
    const kop = `<tr><th>Groep</th><th>n</th>${v.opties.map(o => `<th>${esc(o)}</th>`).join('')}</tr>`;
    const rijen = blokken.map(b => {
      const bv = (b.vragen || []).find(x => x.sleutel === v.sleutel) || { n: 0, opties: [] };
      return `<tr class="${b.totaal ? 'totaal' : ''}"><td>${esc(b.naam)}</td><td class="getal">${bv.n}</td>${v.opties.map(o => {
        const t = (bv.opties || []).find(x => x.optie === o) || { aantal: 0, pct: 0 };
        return `<td class="getal">${t.aantal} (${t.pct}%)<span class="balk" style="width:${Math.round(t.pct * 0.5)}px"></span></td>`;
      }).join('')}</tr>`;
    }).join('');
    return `<h3 style="font-size:13px;margin:12px 0 2px">${esc(weergaveNaam(v.sleutel))} <span class="hint">— ${esc(v.vraag)}</span></h3>
      <div class="tabel-wrap"><table class="uitslag">${kop}${rijen}</table></div>`;
  }).join('');
  const media = (blokken[0] && blokken[0].media || []).map(x => x.naam);
  const perMedium = `<h3 style="font-size:13px;margin:12px 0 2px">Per medium</h3><div class="tabel-wrap"><table class="uitslag">
    <tr><th>Groep</th><th>n</th>${media.map(x => `<th>${esc(x)}</th>`).join('')}</tr>
    ${blokken.map(b => `<tr class="${b.totaal ? 'totaal' : ''}"><td>${esc(b.naam)}</td><td class="getal">${b.n}</td>${media.map(x => {
      const t = (b.media || []).find(y => y.naam === x); return `<td class="getal">${t ? t.aantal : 0}</td>`; }).join('')}</tr>`).join('')}
  </table></div>`;
  const regels = (M.regels || []).map(r => `<li><span>${esc(r)}</span>${M.mag.als_bewijs ? `<button type="button" data-als-bewijs="${esc(r)}">Als bewijs</button>` : `<button type="button" data-kopieer="${esc(r)}">Kopieer</button>`}</li>`).join('');

    ${perVraag}${perMedium}

    <ul class="regels">${regels}</ul>`;
}
function overeenstemmingHtml() {

  return `<h2 class="sectie">Overeenstemming eerste codering en blinde controle ${uitleg("Per vraag het percentage gelijke codes en Cohen's kappa (overeenstemming gecorrigeerd voor toeval). Onder 80% is dat een waarschuwing.")}</h2>
    <div class="tabel-wrap"><table class="uitslag"><tr><th>Vraag</th><th>Controles</th><th>Gelijk</th><th>%</th><th style="text-transform:none">κ</th><th>Afwijkingen</th></tr>

      <td class="getal">${x.kappa == null ? 'n.v.t.' : getal(x.kappa)}</td>

function meldingenHtml() {
  if (!M.meldingen || !M.meldingen.length) return '';
  return `<h2 class="sectie">Meldingen over deze meting (${M.meldingen.length}) ${uitleg('Via de link “Onjuistheid melden”. Een melding over een meting gaat naar de maker, niet naar een agent.')}</h2>
    ${M.meldingen.map(l => `<div class="kaart"><div class="meta"><span>melding #${l.id}</span><span>${tijd(l.created_at)}</span><span class="statusbadge">${esc(l.status)}</span></div>
      <div style="margin:6px 0;white-space:pre-wrap">${esc(l.claim)}</div>

      ${l.quote ? `<blockquote class="hint">${esc(l.quote)}</blockquote>` : ''}
      ${l.triage_reden ? `<div class="hint">${esc(l.triage_reden)}</div>` : ''}
      ${M.mag.meldingen_afhandelen && l.status === 'binnengekomen' ? `<div class="knoppen">
        <button class="akkoord" type="button" onclick="meldingAf(${l.id}, 'gecorroboreerd')">Klopt, verwerkt</button>
        <button type="button" onclick="meldingAf(${l.id}, 'afgewezen')">Geen correctie nodig</button></div>` : ''}
    </div>`).join('')}`;

async function meldingAf(id, status) {
  const reden = await vraagTekst(status === 'gecorroboreerd' ? 'Wat is er gecorrigeerd?' : 'Waarom is geen correctie nodig?',
    { titel: 'Melding afhandelen', okTekst: 'Opslaan' });
  if (reden === null) return;
  const { ok, j } = await api('PATCH', `/api/leads/${id}`, { status, triage_reden: `meting: ${reden}` });
  if (!ok) { melding(j.error || 'Mislukt', 'fout'); return; }
  melding('Melding afgehandeld', 'ok');
  herlaad();
}

      <div class="vol"><label for="oRegel">Hoe vind je de artikelen? ${uitleg('Volledigheid (geen cherry-picking): beschrijf de bron (archief, zoekfunctie, LexisNexis), de zoekopdracht en de volgorde, zodat een ander dezelfde artikelen vindt. Minstens 20 tekens.')}</label>
        <textarea id="oRegel" placeholder="bv. Alle artikelen op nos.nl en rtl.nl met 'defensie' in de periode, via de zoekfunctie, op volgorde van datum">${esc(sel.regel || '')}</textarea></div>

    ${o.groepen.map((g, i) => `<div class="blok">

        <button type="button" onclick="opzetWeg('groepen', ${i})">Weg</button></div>
      <div class="chips">${(g.entity_ids || []).map((id, k) => `<span class="chip-x">${esc(naam(id))}<button type="button" aria-label="Weg" onclick="OPZET.groepen[${i}].entity_ids.splice(${k},1);render()">×</button></span>`).join('')}</div>

    ${o.vragen.map((v, i) => `<div class="blok">

        <div><label>Vraag</label><input class="veld" type="text" value="${esc(v.vraag || '')}" placeholder="Welk standpunt neemt de geciteerde in?" oninput="OPZET.vragen[${i}].vraag=this.value"></div>
        <div class="vol"><label>Opties (één per regel)</label><textarea class="veld" rows="3" oninput="OPZET.vragen[${i}].opties=this.value.split('\\n').map(x=>x.trim()).filter(Boolean)">${esc((v.opties || []).join('\n'))}</textarea></div>

function koppelOpzet() {
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('input', () => fn(el.value)); };
  bind('oVan', v => { OPZET.selectie.periode.van = v || null; });
  bind('oTot', v => { OPZET.selectie.periode.tot = v || null; });
  bind('oZoek', v => { OPZET.selectie.zoektermen = v; });
  bind('oRegel', v => { OPZET.selectie.regel = v; });
  bind('oUitkomst', v => { OPZET.uitkomst = v; });
  bind('oStop', v => { OPZET.stopregel = v; });
  koppelKiezer('oMedium', 'entity', item => {
    if (!OPZET.selectie.media.includes(item.id)) OPZET.selectie.media.push(item.id);
    M.namen[String(item.id)] = item.label; render();
  });
  OPZET.groepen.forEach((g, i) => koppelKiezer('oGroep' + i, 'entity', item => {
    g.entity_ids = g.entity_ids || [];
    if (!g.entity_ids.includes(item.id)) g.entity_ids.push(item.id);
    if (!g.naam) g.naam = item.label;
    M.namen[String(item.id)] = item.label; render();
  }));
}
function opzetWeg(soort, i) {
  if (soort === 'media') OPZET.selectie.media.splice(i, 1); else OPZET[soort].splice(i, 1);
  render();
}
function standaardVragen() {
  const er = new Set(OPZET.vragen.map(v => v.sleutel));
  if (!er.has('standpunt')) OPZET.vragen.push({ sleutel: 'standpunt', vraag: 'Welk standpunt neemt de geciteerde in over het onderwerp?', opties: ['voor', 'tegen', 'neutraal', 'gemengd'] });
  if (!er.has('onderwerp')) OPZET.vragen.push({ sleutel: 'onderwerp', vraag: 'Waarover spreekt de geciteerde?', opties: ['onderwerp van de meting', 'iets anders'] });
  if (!er.has('financiering_vermeld')) OPZET.vragen.push({ sleutel: 'financiering_vermeld', vraag: 'Vermeldt het artikel hoe de organisatie van de geciteerde gefinancierd wordt?', opties: ['ja', 'nee'] });
  render();
}
function opzetSchoon() {
  const o = JSON.parse(JSON.stringify(OPZET)); delete o._id;
  o.groepen = (o.groepen || []).map(g => ({ naam: (g.naam || '').trim(), entity_ids: g.entity_ids || [] }))
    .filter(g => g.naam || g.entity_ids.length);
  o.vragen = (o.vragen || []).map(v => ({ sleutel: (v.sleutel || '').trim(), vraag: (v.vraag || '').trim(), opties: v.opties || [] }))
    .filter(v => v.sleutel || v.vraag || v.opties.length);
  const sel = o.selectie || {};
  o.selectie = { media: sel.media || [], periode: { van: (sel.periode || {}).van || null, tot: (sel.periode || {}).tot || null },
    zoektermen: sel.zoektermen || '', regel: sel.regel || '' };
  return o;
}
async function opzetOpslaan(stil) {
  const body = { titel: document.getElementById('oTitel').value, vraag: document.getElementById('oVraag').value, opzet: opzetSchoon() };
  const { ok, j } = await api('PATCH', `/api/metingen/${M.id}`, body);
  if (!ok) { toonFout(document.getElementById('oFout'), j); return false; }
  if (!stil) melding('Opzet opgeslagen', 'ok');
  OPZET = null; M = j; OPZET = JSON.parse(JSON.stringify(M.opzet)); OPZET._id = M.id; render();
  return true;
}
async function vastleggen() {
  if (M.status === 'opzet' && TAB === 'opzet' && document.getElementById('oTitel')) {
    if (!(await opzetOpslaan(true))) return;
  }
  const ja = await bevestig('Na het vastleggen ligt de opzet vast (sha256): selectieregel, groepen, vragen, uitkomstmaat en stopregel. Pas daarna voer je waarnemingen in. Een andere opzet is een nieuwe meting.',
    { titel: 'Opzet vastleggen', okTekst: 'Vastleggen' });
  if (!ja) return;
  const { ok, j } = await api('POST', `/api/metingen/${M.id}/vastleggen`);
  if (!ok) { TAB = 'opzet'; render(); toonFout(document.getElementById('oFout'), j); return; }
  melding('Opzet vastgelegd', 'ok');
  M = j; TAB = 'waarnemingen'; history.replaceState(null, '', '#waarnemingen'); render();
}
async function afronden() {

// ── Waarnemingen ────────────────────────────────────────────────────────────

      <select class="veld" onchange="FILTER.medium=this.value;render()">${opt('', 'Alle media', FILTER.medium)}${media.map(id => opt(id, naam(id), FILTER.medium)).join('')}</select>
      <select class="veld" onchange="FILTER.citaat=this.value;render()">${opt('', 'Citaat: alle', FILTER.citaat)}${opt('gevonden', 'Citaat teruggevonden', FILTER.citaat)}${opt('niet', 'Citaat niet gevonden', FILTER.citaat)}${opt('open', 'Nog niet gezocht', FILTER.citaat)}</select>

    <div class="wn-kop"><span><b>#${w.id}</b> · ${esc(w.datum)} · ${esc(w.medium || '')} · ${esc(w.groep)} — <b>${esc(w.wie)}</b>${w.entity_naam ? ` <span class="hint">(${esc(w.entity_naam)})</span>` : ''}</span>
      <span>${citaat} ${w.n_controles ? `<span class="tag ok">${w.n_controles} controle${w.n_controles > 1 ? 's' : ''}</span>` : '<span class="tag">niet gecontroleerd</span>'}

    <div class="meta" style="margin-top:4px"><a href="${esc(w.url)}" target="_blank" rel="noopener noreferrer">artikel</a>${w.archief_url ? ` · <a href="${esc(w.archief_url)}" target="_blank" rel="noopener noreferrer">archief</a>` : ''}

}
function invoerFormulier(groepen, media, vragen) {

      <div class="vol"><label>Knoop (optioneel)</label>

      ${vragen.map(q => `<div><label for="iCode-${esc(q.sleutel)}">${esc(weergaveNaam(q.sleutel))} ${uitleg(q.vraag)}</label>

      <div class="vol"><label for="iNotitie">Notitie (optioneel)</label><input id="iNotitie" type="text" maxlength="2000" value="${esc(v.notitie || '')}"></div>

      <span id="iFout"></span></div>

function bewaarInvoer() {
  const val = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  if (!document.getElementById('iUrl')) return;
  const codes = {};
  document.querySelectorAll('.iCode').forEach(s => { if (s.value) codes[s.dataset.sleutel] = s.value; });
  Object.assign(INVOER, { url: val('iUrl').trim(), datum: val('iDatum'), archief_url: val('iArchief').trim(),
    medium_entity_id: val('iMedium') ? +val('iMedium') : null, groep: val('iGroep'), wie: val('iWie'),
    citaat: val('iCitaat'), notitie: val('iNotitie'), codes });
}
function koppelInvoer() {
  const form = document.getElementById('invoer');
  if (!form) return;
  form.addEventListener('input', bewaarInvoer);
  form.addEventListener('change', bewaarInvoer);
  form.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); waarnemingOpslaan(); } });
  koppelKiezer('iKnoop', 'entity', item => { bewaarInvoer(); INVOER.entity_id = item.id; M.namen[String(item.id)] = item.label; render(); });
}
async function waarnemingOpslaan() {

    groep: v.groep, wie: v.wie, entity_id: v.entity_id || null, citaat: v.citaat, codes: v.codes || {}, notitie: v.notitie || null };
  const pad = BEWERK_ID ? `/api/metingen/${M.id}/waarnemingen/${BEWERK_ID}` : `/api/metingen/${M.id}/waarnemingen`;

  melding(BEWERK_ID ? `Waarneming #${j.id} bijgewerkt` : `Waarneming #${j.id} opgeslagen`, 'ok', 2200);

  if (M.status !== 'vastgelegd') return kop + `<div class="banner">${M.status === 'opzet' ? 'Controleren kan zodra de opzet vastligt en er waarnemingen zijn.' : 'De meting is afgerond; de controles liggen vast.'}</div>` + overeenstemmingHtml();

        : 'Er is niets meer voor jou om blind te coderen.'} (door jou gecontroleerd: ${CONTROLE.door_mij})</div>`;
    } else {
      const w = CONTROLE.te_controleren[0];
      blok = `<div class="kaart" id="controleKaart">

          <span>nog ${CONTROLE.te_controleren.length} voor jou</span></div>
        <h3 style="margin-top:8px">${esc(w.wie)}</h3>
        <blockquote class="citaat-blok">“${esc(w.citaat)}”</blockquote>
        <div class="meta"><a href="${esc(w.url)}" target="_blank" rel="noopener noreferrer">Lees het artikel</a>${w.archief_url ? ` · <a href="${esc(w.archief_url)}" target="_blank" rel="noopener noreferrer">archiefkopie</a>` : ''}</div>
        <div class="raster" style="margin-top:8px">${CONTROLE.vragen.map(v => `<div><label class="veldlabel" for="c-${esc(v.sleutel)}">${esc(weergaveNaam(v.sleutel))} ${uitleg(v.vraag)}</label>
          <select class="veld cCode" id="c-${esc(v.sleutel)}" data-sleutel="${esc(v.sleutel)}"><option value="">— kies —</option>${v.opties.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`).join('')}</div>
        <div class="knoppen"><button class="prim" type="button" onclick="controleIndienen(${w.id})">Codeer blind</button><span id="cFout"></span></div>

async function laadControle() {

async function controleIndienen(wid) {

  const bron = M.bron;
  const args = M.argumenten.length ? M.argumenten.map(a => `<div class="kaart">
      <div class="meta"><span>argument #${a.id}</span><span class="statusbadge ${esc(a.status)}">${esc(a.status)}</span>
        <span>${a.stance === 'supporting' ? 'steunt' : a.stance === 'contradicting' ? 'weerlegt' : esc(a.stance)}${a.property === 'influence' ? ' (invloed)' : ''}</span>
        <span>doel: ${esc(a.doel || '')}${a.doel_relatietype ? ' (' + esc(relLabel(a.doel_relatietype)) + ')' : ''}</span><span>door ${esc(a.contributed_by)}</span></div>
      <div style="margin:6px 0">${esc(a.claim)}</div><div class="hash">“${esc(a.quote || '')}”</div></div>`).join('')
    : '<div class="leeg">Nog geen argument steunt op deze meting.</div>';
  return `
    ${M.status !== 'afgerond' ? '<div class="banner">Pas na het afronden kan een meting als bewijs dienen. Dan moeten alle journalistieke codes a–h in orde zijn.</div>' : ''}
    ${M.mag.als_bewijs ? bewijsFormulier() : ''}
    ${bron ? gewichtHtml(bron) : ''}
    <h2 class="sectie">Argumenten die op deze meting steunen</h2>${args}`;
}
function bewijsFormulier() {
  const regels = M.regels || [];
  const doel = BEWIJS.doel;
  const voorstel = BEWIJS.regel ? standaardClaim(BEWIJS.regel) : '';
  return `<div class="form" id="bewijsForm">
    <h4>Gebruik als bewijs ${uitleg('Er komt een bron “Eigen meting #… ” (dataset) met deze pagina als vindplaats, en een argument met één citatie: de gekozen samenvattingsregel, letterlijk. Een argument van een maintainer telt meteen; anders landt het als voorstel en gaat het langs de automatische beoordeling. metingcheck geeft het onafhankelijke A1-oordeel.')}</h4>
    <div class="raster">
      <div><label for="bSoort">Soort doel</label><select id="bSoort">
        <option value="relation" ${BEWIJS.soort === 'relation' ? 'selected' : ''}>Verband</option>
        <option value="entity" ${BEWIJS.soort === 'entity' ? 'selected' : ''}>Knoop</option>
        <option value="mechanism" ${BEWIJS.soort === 'mechanism' ? 'selected' : ''}>Mechanisme</option></select></div>
      <div><label>Doel</label>${doel ? `<div class="chips"><span class="chip-x">${esc(doel.label)} <small class="hint">#${doel.id}</small><button type="button" aria-label="Weg" onclick="BEWIJS.doel=null;render()">×</button></span></div>` : kiezer('bDoel', 'Zoek op naam')}</div>
      <div><label for="bStance">Richting</label><select id="bStance"><option value="supporting">Steunt het doel</option><option value="contradicting" ${BEWIJS.stance === 'contradicting' ? 'selected' : ''}>Weerlegt het doel</option></select></div>
      <div><label class="veldlabel" style="margin-top:8px"><input type="checkbox" id="bInvloed" style="width:auto" ${BEWIJS.invloed ? 'checked' : ''}> Gaat over de sterkte van de invloed ${uitleg("property 'influence': het argument zegt iets over hoe sterk het verband doorwerkt, niet over het bestaan ervan.")}</label></div>
      <div class="vol"><label for="bRegel">Samenvattingsregel (het citaat)</label><select id="bRegel"><option value="">— kies een regel —</option>${regels.map(r => `<option ${r === BEWIJS.regel ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>
      <div class="vol"><label for="bClaim">Claim ${uitleg('Feit en mening gescheiden (punt f): de claim beschrijft alleen wat gemeten is — wie, waar, hoe vaak, in welke periode — zonder oordeel (“eenzijdig”, “ondermijnt”). Een oordeel van een ander mag alleen als citaat met naam.')}</label>
        <textarea id="bClaim" rows="3">${esc(BEWIJS.claim || voorstel)}</textarea><div id="bToets"></div></div>
    </div>
    <div class="knoppen"><button class="prim" type="button" onclick="bewijsIndienen()">Indienen als bewijs</button><span id="bFout"></span></div>
  </div>`;
}
function standaardClaim(regel) {
  const sel = (M.opzet.selectie || {}), p = sel.periode || {};
  const media = (sel.media || []).map(naam).join(' en ');
  return `In eigen meting #${M.id} (${media}, ${p.van || '…'} tot en met ${p.tot || '…'}): ${regel}`;
}
function koppelBewijs() {
  const soort = document.getElementById('bSoort');
  if (soort) soort.addEventListener('change', () => { BEWIJS.soort = soort.value; BEWIJS.doel = null; bewaarBewijs(); render(); });
  koppelKiezer('bDoel', () => BEWIJS.soort, item => { bewaarBewijs(); BEWIJS.doel = item; render(); });
  const regel = document.getElementById('bRegel'), claim = document.getElementById('bClaim');
  if (regel) regel.addEventListener('change', () => {
    const oud = BEWIJS.regel ? standaardClaim(BEWIJS.regel) : '';
    BEWIJS.regel = regel.value || null;
    if (claim && (!claim.value.trim() || claim.value === oud)) claim.value = BEWIJS.regel ? standaardClaim(BEWIJS.regel) : '';
    BEWIJS.claim = claim ? claim.value : '';
    claimToets();
  });
  if (claim) { claim.addEventListener('input', () => { BEWIJS.claim = claim.value; clearTimeout(CLAIM_TIMER); CLAIM_TIMER = setTimeout(claimToets, 350); }); claimToets(); }
}
function bewaarBewijs() {
  const claim = document.getElementById('bClaim'), regel = document.getElementById('bRegel');
  const stance = document.getElementById('bStance'), invloed = document.getElementById('bInvloed');
  if (claim) BEWIJS.claim = claim.value;
  if (regel) BEWIJS.regel = regel.value || null;
  if (stance) BEWIJS.stance = stance.value;
  if (invloed) BEWIJS.invloed = invloed.checked;
}
async function claimToets() {
  const claim = document.getElementById('bClaim'), uit = document.getElementById('bToets');
  if (!claim || !uit) return;
  if (!claim.value.trim()) { uit.innerHTML = ''; return; }
  const { ok, j } = await api('GET', '/api/metingen/claimtoets?claim=' + encodeURIComponent(claim.value));
  if (!ok) return;
  uit.innerHTML = j.ok ? '<span class="toets-ok">✓ Beschrijft wat gemeten is: geen oordeel in de eigen stem gevonden.</span>'
    : `<span class="toets-fout">✗ Oordeel of etiket in de eigen stem: ${j.treffers.map(esc).join(', ')}. Beschrijf alleen wat gemeten is, of citeer het oordeel met naam.</span>`;
}
async function regelAlsBewijs(regel) {
  BEWIJS.regel = regel; BEWIJS.claim = standaardClaim(regel);
  kiesTab('bewijs');
}
async function bewijsIndienen() {
  bewaarBewijs();
  const fout = document.getElementById('bFout');
  if (!BEWIJS.doel) { fout.innerHTML = '<span class="fout-tekst">Kies een doel.</span>'; return; }
  const body = { stance: document.getElementById('bStance').value, property: document.getElementById('bInvloed').checked ? 'influence' : null,
    claim: (document.getElementById('bClaim').value || '').trim(), regel: BEWIJS.regel };
  body[{ relation: 'relation_id', entity: 'entity_id', mechanism: 'mechanism_id' }[BEWIJS.soort]] = BEWIJS.doel.id;
  let { ok, status, j } = await api('POST', `/api/metingen/${M.id}/als_bewijs`, body);
  if (status === 409 && j.duplicaat_kandidaten) {
    const verder = await bevestig('Op dit doel staat al een argument dat hierop lijkt:\n\n' + j.duplicaat_kandidaten.map(k => `#${k.id}: ${k.claim}`).join('\n') + '\n\nToch indienen als nieuw argument?',
      { titel: 'Mogelijk dubbel', okTekst: 'Toch indienen' });
    if (!verder) return;
    ({ ok, status, j } = await api('POST', `/api/metingen/${M.id}/als_bewijs`, Object.assign(body, { negeer_duplicaten: true })));
  }
  if (!ok) { toonFout(fout, j); return; }
  melding(`Argument #${j.argument_id} ingediend (${j.argument_status}) op bron #${j.source_id}`, 'ok', 5000);
  BEWIJS = { soort: BEWIJS.soort, doel: null, regel: null, claim: '', stance: 'supporting', invloed: false };
  await herlaad();
  const g = document.getElementById('gewicht'); if (g) g.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function gewichtHtml(bron) {
  const mag = M.mag.classificeren;
  return `<div class="kaart" id="gewicht">
    <h3>Hoe zwaar weegt deze meting? ${uitleg('De bron telt mee met het gewicht van haar betrouwbaarheidsklasse (scoring.RELIABILITY_WEIGHT) maal de relevantiefactor van het onderwerp. Een dataset mag geen “academisch” zijn. Alleen de eigenaar (maintainer) kiest het gewicht van een eigen meting.')}</h3>
    <div class="meta"><span>bron #${bron.id}: ${esc(bron.title)}</span><span>nu: <b>${esc(weergaveNaam(bron.reliability))}</b> (gewicht ${getal(bron.gewicht)})</span>
      <span>onderwerp: ${esc(ONDERWERP_LABEL[bron.onderwerp] || bron.onderwerp)} (×${getal(bron.relevantie)})</span></div>
    <div class="klassen">${M.bronklassen.map(k => `<label class="klasse ${k.toegestaan ? '' : 'niet'}" ${k.toegestaan ? '' : `title="${esc(k.probleem)}"`}>
      <input type="radio" name="klasse" value="${esc(k.klasse)}" ${k.klasse === bron.reliability ? 'checked' : ''} ${(!mag || !k.toegestaan) ? 'disabled' : ''}>
      <span>${esc(weergaveNaam(k.klasse))} <span class="gewicht">${getal(k.gewicht)}</span>${k.toegestaan ? '' : '<small>past niet bij een dataset</small>'}</span></label>`).join('')}</div>
    ${mag ? `<div class="raster"><div><label for="gOnderwerp" class="veldlabel">Onderwerp</label><select class="veld" id="gOnderwerp">${M.onderwerpen.map(o => `<option value="${esc(o.onderwerp)}" ${o.onderwerp === bron.onderwerp ? 'selected' : ''}>${esc(ONDERWERP_LABEL[o.onderwerp] || o.onderwerp)} (×${getal(o.factor)})</option>`).join('')}</select></div>
      <div><label for="gMotivatie" class="veldlabel">Motivatie</label><input class="veld" id="gMotivatie" type="text" placeholder="Waarom dit gewicht?"></div></div>
      <div class="knoppen"><button class="prim" type="button" onclick="gewichtOpslaan(${bron.id})">Gewicht vastleggen</button><span id="gFout"></span></div>`
    : '<p class="hint">Het gewicht van een eigen meting bepaalt de eigenaar.</p>'}
  </div>`;
}
async function gewichtOpslaan(sid) {
  const klasse = (document.querySelector('input[name="klasse"]:checked') || {}).value;
  if (!klasse) { document.getElementById('gFout').innerHTML = '<span class="fout-tekst">Kies een klasse.</span>'; return; }
  const { ok, j } = await api('PATCH', `/api/sources/${sid}/classificatie`, { reliability: klasse,
    onderwerp: document.getElementById('gOnderwerp').value, motivatie: document.getElementById('gMotivatie').value.trim() || 'gewicht van een eigen meting' });
  if (!ok) { toonFout(document.getElementById('gFout'), j); return; }
  melding(`Gewicht vastgelegd: ${weergaveNaam(j.reliability)}`, 'ok');
  herlaad();
}

// ── Start ───────────────────────────────────────────────────────────────────
(async function () {
  ME = await hsMe();
  if (ME && ME.error) ME = null;
  if (M_ID) { await herlaad(); if (TAB === 'controle') laadControle(); }
  else laadLijst();
})();
</script>
</body>
</html>
